<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>మండి ధరలు - లైవ్ సెర్చ్</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      padding: 16px;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 16px;
      border-radius: 10px;
      max-width: 600px;
      margin: 0 auto;
      border: 1px solid #dcdcdc;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    h2 {
      margin: 0 0 14px 0;
      color: #1b5e20;
      font-size: 1.2rem;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    select, input {
      padding: 10px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
    }
    select {
      background: #e8f5e9;
      font-weight: bold;
      color: #1b5e20;
    }
    input {
      width: 100%;
      box-sizing: border-box;
    }
    #status {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: #2e7d32;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 10px 6px;
      text-align: left;
    }
    th {
      background: #e8f5e9;
      color: #1b5e20;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🌾 మార్కెట్ లైవ్ ధరలు & సెర్చ్</h2>
    
    <div class="controls">
      <select id="state-select" onchange="renderMandiTable()">
        <option value="Telangana">తెలంగాణ (Telangana)</option>
        <option value="Andhra Pradesh">ఆంధ్రప్రదేశ్ (Andhra Pradesh)</option>
        <option value="Karnataka">కర్ణాటక (Karnataka)</option>
        <option value="Maharashtra">మహారాష్ట్ర (Maharashtra)</option>
      </select>
      <input type="text" id="crop-search" placeholder="🔍 పంట పేరు సెర్చ్ చేయండి (ఉదా: పత్తి, మిర్చి, టమాటా)..." oninput="renderMandiTable()">
    </div>

    <div id="status">ధరలు లోడ్ అవుతున్నాయి...</div>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>పంట</th>
            <th>మార్కెట్</th>
            <th>ధర (క్వింటాల్)</th>
          </tr>
        </thead>
        <tbody id="mandi-body">
          <tr>
            <td colspan="3" style="text-align: center; color: #888;">డేటా సిద్ధమవుతోంది...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const mandiDatabase = {
      "Telangana": [
        { crop: "పత్తి (Cotton)", market: "వరంగల్ (ఎనుమాముల)", price: "₹7,850" },
        { crop: "మిర్చి (Chilli Red)", market: "ఖమ్మం యార్డ్", price: "₹16,400" },
        { crop: "వరి (Paddy BPT)", market: "నిజామాబాద్", price: "₹2,380" },
        { crop: "మొక్కజొన్న (Maize)", market: "బాదేపల్లి", price: "₹2,320" },
        { crop: "పసుపు (Turmeric)", market: "నిజామాబాద్", price: "₹14,200" },
        { crop: "టమాటా (Tomato)", market: "బోయిన్‌పల్లి (హైదరాబాద్)", price: "₹1,800" },
        { crop: "ఉల్లి (Onion)", market: "మలక్‌పేట్", price: "₹2,200" },
        { crop: "కంది (Toor / Red Gram)", market: "తాండూరు", price: "₹9,800" },
        { crop: "సోయాబీన్ (Soyabean)", market: "ఆదిలాబాద్", price: "₹4,450" },
        { crop: "వేరుశనగ (Groundnut)", market: "మహబూబ్‌నగర్", price: "₹6,700" }
      ],
      "Andhra Pradesh": [
        { crop: "మిర్చి (Teja Chilli)", market: "గుంటూరు మార్కెట్", price: "₹17,200" },
        { crop: "పత్తి (Cotton)", market: "కర్నూలు", price: "₹7,700" },
        { crop: "వరి (Paddy)", market: "నెల్లూరు", price: "₹2,360" },
        { crop: "వేరుశనగ (Groundnut)", market: "అనంతపురం", price: "₹6,900" },
        { crop: "పసుపు (Turmeric)", market: "దుగ్గిరాల", price: "₹13,800" },
        { crop: "టమాటా (Tomato)", market: "మదనపల్లె", price: "₹1,600" },
        { crop: "ఉల్లి (Onion)", market: "కర్నూలు", price: "₹1,950" },
        { crop: "మొక్కజొన్న (Maize)", market: "కడప", price: "₹2,250" },
        { crop: "అరటి (Banana)", market: "రాజమండ్రి", price: "₹1,500" }
      ],
      "Karnataka": [
        { crop: "పత్తి (Cotton)", market: "రాయచూర్ (Raichur)", price: "₹7,600" },
        { crop: "కంది (Tur / Arhar)", market: "కలబురగి (Gulbarga)", price: "₹10,200" },
        { crop: "మొక్కజొన్న (Maize)", market: "దావణగెరె (Davangere)", price: "₹2,290" },
        { crop: "బ్యాడగి మిర్చి (Chilli)", market: "బ్యాడగి (Byadgi)", price: "₹24,500" },
        { crop: "టమాటా (Tomato)", market: "కోలార్ (Kolar)", price: "₹1,700" }
      ],
      "Maharashtra": [
        { crop: "పత్తి (Cotton)", market: "నాగ్‌పూర్ (Nagpur)", price: "₹7,750" },
        { crop: "సోయాబీన్ (Soyabean)", market: "లాతూర్ (Latur)", price: "₹4,600" },
        { crop: "ఉల్లి (Onion)", market: "లాసల్‌గావ్ (Nashik)", price: "₹1,850" },
        { crop: "శనగ (Chana)", market: "అకోలా (Akola)", price: "₹5,800" },
        { crop: "దానిమ్మ (Pomegranate)", market: "షోలాపూర్ (Solapur)", price: "₹9,500" }
      ]
    };

    function renderMandiTable() {
      const stateSelect = document.getElementById("state-select");
      const searchInput = document.getElementById("crop-search");
      const statusEl = document.getElementById("status");
      const tbody = document.getElementById("mandi-body");

      if (!stateSelect || !tbody) return;

      const state = stateSelect.value;
      const searchKey = searchInput ? searchInput.value.trim().toLowerCase() : "";
      const crops = mandiDatabase[state] || [];

      const filtered = crops.filter(item => {
        return item.crop.toLowerCase().includes(searchKey) || 
               item.market.toLowerCase().includes(searchKey);
      });

      if (filtered.length === 0) {
        statusEl.innerText = `"${searchKey}" పేరుతో పంటలు ఏవీ దొరకలేదు.`;
        statusEl.style.color = "#c62828";
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:16px; color:#888;">ఫలితాలు లేవు.</td></tr>`;
        return;
      }

      statusEl.innerText = `${state} లో ${filtered.length} పంటల ధరలు అందుబాటులో ఉన్నాయి.`;
      statusEl.style.color = "#1b5e20";

      let rows = "";
      filtered.forEach(item => {
        rows += `
          <tr>
            <td style="font-weight: 600; color: #2e7d32;">${item.crop}</td>
            <td style="color: #444;">${item.market}</td>
            <td style="font-weight: bold; color: #d84315;">${item.price}</td>
          </tr>
        `;
      });
      tbody.innerHTML = rows;
    }

    // పేజీ లోడ్ కాగానే వెంటనే రన్ అవుతుంది
    renderMandiTable();
  </script>
</body>
</html>
