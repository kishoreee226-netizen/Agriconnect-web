<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Farmer & Labour Matching</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f0;
      color: #333;
      padding: 10px;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
      padding-top: 6px;
    }
    header h1 {
      font-size: 20px;
      color: #1b5e20;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    header p {
      font-size: 11px;
      color: #388e3c;
      font-weight: 600;
      margin-top: 2px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌾 AgriConnect</h1>
    <p>⚡ లైవ్ హైపర్‌లోకల్ మ్యాచింగ్ (5-10 KM)</p>
  </header>

  <div class="container">
    <!-- 1. Farmer Post & Accepted Labours Widget -->
    <div id="farmer-post-container"></div>

    <!-- 2. Labour Job Feed & Navigation Widget -->
    <div id="labour-jobs-container"></div>
  </div>

  <!-- JavaScript Modules (Labour mundhu load ayyi, tharvatha Farmer load avvali) -->
  <script src="labour.js"></script>
  <script src="farmer.js"></script>

</body>
</html>
