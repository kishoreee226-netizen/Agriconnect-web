<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Kisan & Labour Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f7f4;
      color: #333;
      padding: 12px;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
    }
    header h1 {
      font-size: 20px;
      color: #1b5e20;
    }
    header p {
      font-size: 12px;
      color: #555;
    }
    .main-layout {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌾 AgriConnect</h1>
    <p>రైతులు, కూలీలు & లైవ్ మార్కెట్ రేట్ల వేదిక</p>
  </header>

  <div class="main-layout">
    <!-- 1. Live Mandi Rates Widget (Compact Right/Side Card) -->
    <div id="mandi-box"></div>

    <!-- 2. Kisan & Labour Instant Wallet Widget -->
    <div id="wallet-container"></div>

    <!-- 3. Farmer Post Form (5-10 KM Hyperlocal GPS) -->
    <div id="farmer-post-container"></div>

    <!-- 4. Labour Jobs Feed & Route Navigation -->
    <div id="labour-jobs-container"></div>
  </div>

  <!-- JavaScript Modules -->
  <script src="mandi.js"></script>
  <script src="wallet.js"></script>
  <script src="farmer.js"></script>
  <script src="labour.js"></script>

</body>
</html>
