<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f8; padding: 12px; }
    header { background: #1b5e20; color: white; padding: 12px; border-radius: 8px; margin-bottom: 12px; text-align: center; }
    .card { background: white; border-radius: 8px; padding: 14px; margin-bottom: 12px; border: 1px solid #ddd; }
    .card-title { font-weight: bold; margin-bottom: 10px; color: #2e7d32; }
    .item { background: #f1f8e9; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #2e7d32; }
  </style>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <header>
    <h2>🌾 AgriConnect Technologies</h2>
    <p>Live Dashboard</p>
  </header>

  <div class="card">
    <div class="card-title">👥 కూలీల వివరాలు (Laborers)</div>
    <div id="labor-list">డేటా లోడ్ అవుతోంది...</div>
  </div>

  <div class="card">
    <div class="card-title">🌾 మార్కెట్ ధరలు (Mandi Rates)</div>
    <div id="mandi-list">ధరలు లోడ్ అవుతున్నాయి...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvev9rVOBx5xE1A993EtSD7FG9JxAmbyI",
      authDomain: "agriconnect-5fc39.firebaseapp.com",
      projectId: "agriconnect-5fc39",
      storageBucket: "agriconnect-5fc39.firebasestorage.app",
      messagingSenderId: "491716802186",
      appId: "1:491716802186:web:087ee5f6c30ec75ce75f73"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 1. కూలీలు
    db.collection("laborers").onSnapshot(snap => {
      const el = document.getElementById("labor-list");
      if (snap.empty) {
        el.innerHTML = "<p>డేటా ఏదీ లేదు.</p>";
        return;
      }
      let html = "";
      snap.forEach(doc => {
        const d = doc.data();
        html += `<div class="item"><b>${d.name || "కూలీ"}</b> - ${d.skills || d.work || "పనులు"} (${d.village || d.location || "హనుమకొండ"})</div>`;
      });
      el.innerHTML = html;
    }, err => {
      document.getElementById("labor-list").innerHTML = "<p style='color:red;'>Error: " + err.message + "</p>";
    });

    // 2. మండి రేట్లు
    db.collection("mandi_rates").onSnapshot(snap => {
      const el = document.getElementById("mandi-list");
      if (snap.empty) {
        el.innerHTML = "<p>మార్కెట్ ధరలు ఏవీ లేవు.</p>";
        return;
      }
      let html = "";
      snap.forEach(doc => {
        const m = doc.data();
        html += `<div class="item"><b>${m.crop || m.commodity || "పంట"}</b>: ₹${m.price || "--"} (${m.market || "మార్కెట్"})</div>`;
      });
      el.innerHTML = html;
    }, err => {
      document.getElementById("mandi-list").innerHTML = "<p style='color:red;'>Error: " + err.message + "</p>";
    });
  </script>

</body>
</html>
