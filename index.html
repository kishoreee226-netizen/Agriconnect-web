<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect</title>
  <link rel="stylesheet" href="style.css?v=999">
    <!-- Free Leaflet Map Library for Farm Pin Selection -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>

<body>

  <div class="container">
    <!-- Role & Auth Containers -->
    <div id="roles-container"></div>
    <div id="auth-container"></div>

    <!-- 1st: Farmer Widget Container -->
    <div id="farmer-post-container"></div>

    <!-- 2nd: Labour Widget Container -->
    <div id="labour-jobs-container"></div>

    <!-- 3rd: Equipment / Seeds / Provider Container -->
    <div id="provider-container"></div>

    <!-- 4th: Wallet Widget Container -->
    <div id="wallet-container"></div>

    <!-- 5th: Market / Mandi Widget Container -->
    <div id="mandi-container"></div>

    <!-- 6th: Weather Widget Container -->
    <div id="weather-container"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- 1. Config & Core Services -->
  <script src="config.js?v=999"></script>
  <script src="firebase-config.js?v=999"></script>
  <script src="firebase-db.js?v=999"></script>
  <script src="state.js?v=999"></script>
  <script src="auth.js?v=999"></script>

  <!-- 2. Modals -->
  <script src="farmer-job-modal.js?v=999"></script>
  <script src="labour-profile-modal.js?v=999"></script>

  <!-- 3. Sub-modules & Helpers -->
  <script src="voice.js?v=999"></script>
  <script src="weather.js?v=5"></script>
  <script src="equipment.js?v=999"></script>
  <script src="seeds.js?v=999"></script>
  <script src="transport.js?v=999"></script>

  <!-- 4. Main Widgets -->
  <script src="mandi.js?v=999"></script>
  <script src="wallet.js?v=999"></script>
  <script src="farmer.js?v=999"></script>
  <script src="labour.js?v=999"></script>
  <script src="provider.js?v=999"></script>

  <!-- 5. Role Controller -->
  <script src="role.js?v=999"></script>

  <!-- Initialization Logic -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // 1. Mandi
      if (typeof renderMandiWidget === "function") {
        renderMandiWidget();
      } else if (typeof renderMandi === "function") {
        renderMandi();
      }

      // 2. Wallet
      if (typeof renderWalletWidget === "function") {
        renderWalletWidget();
      }

      // 3. Weather
      if (typeof window.renderWeatherWidget === "function") {
        window.renderWeatherWidget();
      }

      // 4. Role View Controller (దీని ద్వారానే లాగిన్ చెక్, హెడర్, రోల్స్ అన్నీ హ్యాండిల్ అవుతాయి)
      if (typeof applyUserRoleView === "function") {
        applyUserRoleView();
      }
    });
  </script>

</body>
</html>
