<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Hyperlocal Matching</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f4f0; color: #333; padding: 10px; }
    header { text-align: center; margin-bottom: 12px; }
    header h1 { font-size: 20px; color: #1b5e20; }
    header p { font-size: 11px; color: #388e3c; font-weight: 600; margin-top: 2px; }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>🌾 AgriConnect</h1>
    <p>⚡ లైవ్ హైపర్‌లోకల్ మ్యాచింగ్ (5-10 KM)</p>
  </header>

  <div class="container">
    <!-- 1. Farmer Widget Container -->
    <div id="farmer-post-container"></div>

    <!-- 2. Labour Widget Container -->
    <div id="labour-jobs-container"></div>
  </div>

  <!-- Shared Global Data Store -->
  <script>
    let appJobs = [
      {
        id: "JOB-1",
        farmerName: "కిషోర్",
        farmerPhone: "9876543210",
        crop: "వరి (Paddy)",
        workType: "కోత",
        count: 2,
        wage: 450,
        distanceKm: "2.4",
        lat: 17.9784,
        lng: 79.5941,
        status: "Open",
        labourName: "",
        labourPhone: ""
      }
    ];

    window.getAppJobs = function() { return appJobs; };
    window.addAppJob = function(job) { appJobs.unshift(job); };
  </script>

  <!-- External Modular Scripts -->
  <script src="farmer.js"></script>
  <script src="labour.js"></script>

  <!-- Initial Load -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (window.renderFarmerWidget) window.renderFarmerWidget();
      if (window.renderLabourWidget) window.renderLabourWidget();
    });
  </script>

</body>
</html>
