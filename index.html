<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - 8 Grid Super App</title>
<link rel="stylesheet" href="style.css">

  <style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f4f7f4;
    color: #333;
    padding: 10px;
  }
  header {
    max-width: 420px;
    margin: 0 auto 12px auto;
    text-align: center;
    background-color: #1b5e20 !important;
    padding: 12px 8px;
    border-radius: 8px;
  }
  header h1 {
    font-size: 20px;
    color: #ffffff !important;
    margin-bottom: 4px;
  }
  header p {
    color: #e8f5e9 !important;
    font-size: 11px;
  }
  .container {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
      /* Widgets compact height rules */
  .mandi-scroll, .custom-scroll, 
.labour-scroll {
    max-height: 220px !important;
    overflow-y: auto !important;
  }

  </style>
</head>
<body>

  <header>
    <h1> </h1>
    
  </header>

  <div class="container">
    <!-- 1st: Farmer Widget Container -->
<div id="farmer-post-container"></div>

<!-- 2nd: Labour Widget Container -->
<div id="labour-jobs-container"></div>

<!-- 3rd: Wallet Widget Container -->
<div id="wallet-container"></div>

<!-- 4th: Market / Mandi Widget Container -->
<div id="mandi-container"></div>

    <!-- మిగిలిన 4 భాగాల కోసం ఖాళీ స్థలం (Slot 5 to 8) -->
    <div class="future-grid-placeholder">
      🌱 క్రింది 4 భాగాలు (పరికరాలు / విత్తనాలు / రవాణా / వాతావరణం) త్వరలో రానున్నాయి...
    </div>
  </div>

  <!-- Shared State ముందుగా లోడ్ అవ్వాలి -->
  <script src="state.js?v=301"></script>
  <script src="role.js?v=301"></script>

  <!-- 4 వేర్వేరు విడ్జెట్ల జావాస్క్రిప్ట్ ఫైల్స్ -->
  <script src="mandi.js?v=301"></script>
  <script src="wallet.js?v=301"></script>
  <script src="farmer.js?v=301"></script>
  <script src="labour.js?v=301"></script>
  <script src="voice.js?v=301"></script>


  <!-- అన్ని విడ్జెట్లను ప్రారంభించే లాజిక్ -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // 1. Mandi
      if (typeof renderMandiWidget === "function") {
        renderMandiWidget();
      } else if (typeof renderMandi === "function") {
        renderMandi();
      }

      // 2. Wallet
      if (typeof renderWalletWidget === "function") {
        renderWalletWidget();
      }

      // 3. Farmer
      if (typeof renderFarmerWidget === "function") {
        renderFarmerWidget();
      }

      // 4. Labour
      if (typeof renderLabourWidget === "function") {
        renderLabourWidget();
      }
    });
  </script>
<script src="config.js"></script>
</body>
</html>
