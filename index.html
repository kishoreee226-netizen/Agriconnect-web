<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect</title>
  <link rel="stylesheet" href="style.css?v=999">
  <!-- Free Leaflet Map Library for Farm Pin Selection -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <div class="container">
    <!-- Role & Profile Switcher Container (Fixed ID: role-container) -->
    <div id="roles-container"></div>

    <!-- 1st: Farmer Widget Container -->
    <div id="farmer-post-container"></div>

    <!-- 2nd: Labour Widget Container -->
    <div id="labour-jobs-container"></div>

    <!-- 3rd: Equipment / Seeds / Provider Container -->
    <div id="provider-container"></div>

    <!-- SMART Agri Tools (8 Power Tools) -->
    <div id="agri-tools-box"></div>

    <!-- Utilities Section Slot -->
    <div id="utilitiesMountSlot"></div>

    <!-- 4th: Wallet Widget Container -->
    <div id="wallet-container"></div>

    <!-- 5th: Weather Widget Container -->
    <div id="weather-container"></div>

    <!-- 6th: Market / Mandi Widget Container -->
    <div id="mandi-container"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- 1. Config & Core Services -->
  <script src="config.js?v=999"></script>
  <script src="firebase-config.js?v=999"></script>
  <script src="firebase-db.js?v=999"></script>
  <script src="state.js?v=999"></script>

  <!-- 2. Common Tools & Menus -->
  <script src="tools/tools-loader.js" defer></script>
  <script src="menu/menu-loader.js" defer></script>
  <script src="utilities/utilities-loader.js" defer></script>
  <script src="auth/auth-loader.js" defer></script>

  <!-- 3. Sub-modules & Helpers -->
  <script src="voice.js?v=999"></script>
  <script src="weather.js?v=5"></script>
  <script src="mandi.js?v=999"></script>

  <!-- 4. Plugin Architecture Services -->

<script src="auth/auth-loader.js"></script>

  <!-- 5. Core Feature Loaders (4-File Pattern) -->
  <script src="wallet/wallet-loader.js?v=1.0" defer></script>
 

<!-- Core Modules Loaders -->
<script src="farmer/farmer-loader.js"></script>
<script src="labour/labour-loader.js"></script>
<script src="provider/provider-loader.js"></script>
<script src="role/role-loader.js"></script>

<!-- Business Logic Scripts -->
<script src="auth/auth.js"></script>
<script src="farmer/farmer.js"></script>
<script src="labour/labour.js"></script>
<script src="provider/provider.js"></script>
<script src="role/role.js"></script>

  <!-- Initialization Logic -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // 1. Mandi Widget
      if (typeof renderMandiWidget === "function") {
        renderMandiWidget();
      } else if (typeof renderMandi === "function") {
        renderMandi();
      }

      // 2. Weather Widget
      if (typeof window.renderWeatherWidget === "function") {
        window.renderWeatherWidget();
      }

      // 3. Wallet & Role Views (Module Loaders ద్వారా ఆటో-ఇనిషియలైజ్ అవుతాయి)
      if (typeof window.renderWalletWidget === "function") {
        window.renderWalletWidget();
      }
      if (typeof window.applyUserRoleView === "function") {
        window.applyUserRoleView();
      }
    });
  </script>

</body>
</html>
