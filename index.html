<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Hyperlocal Matching</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f4f0; color: #333; padding: 10px; }
    header { text-align: center; margin-bottom: 12px; }
    header h1 { font-size: 20px; color: #1b5e20; }
    header p { font-size: 11px; color: #388e3c; font-weight: 600; margin-top: 2px; }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>🌾 AgriConnect</h1>
    <p>⚡ లైవ్ హైపర్‌లోకల్ మ్యాచింగ్ (5-10 KM)</p>
  </header>

  <div class="container">
    <!-- 1. Farmer Widget Container -->
    <div id="farmer-post-container"></div>

    <!-- 2. Labour Widget Container -->
    <div id="labour-jobs-container"></div>
  </div>

  <script>
    let appJobs = [
      {
        id: "JOB-1",
        farmerName: "కిషోర్",
        farmerPhone: "9876543210",
        crop: "వరి (Paddy)",
        workType: "కోత",
        count: 2,
        wage: 450,
        distanceKm: "2.4",
        lat: 17.9784,
        lng: 79.5941,
        status: "Open",
        labourName: "",
        labourPhone: ""
      }
    ];

    let currentLat = 17.9784;
    let currentLng = 79.5941;

    // 1. Farmer Widget (Light Green Header & Compact Submit)
    function renderFarmerWidget() {
      const container = document.getElementById("farmer-post-container");
      if (!container) return;

      const myAcceptedJobs = appJobs.filter(j => j.status === "Confirmed");

      container.innerHTML = `
        <div style="background: #ffffff; border: 1.5px solid #81c784; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.06);">
          <div style="background: #e8f5e9; border-bottom: 1.5px solid #c8e6c9; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; color: #1b5e20; font-size: 14px; font-weight: 700;">
              👨‍🌾 రైతు డ్యాష్‌బోర్డ్ (కూలీలను వెతకడం)
            </h3>
            <span style="font-size: 10px; background: #c8e6c9; color: #1b5e20; padding: 2px 7px; border-radius: 4px; font-weight: 700;">Live</span>
          </div>

          <div style="padding: 12px;">
            <form id="farmer-form" style="display: flex; flex-direction: column; gap: 8px;">
              <div style="display: flex; gap: 6px;">
                <input type="text" id="f-name" placeholder="మీ పేరు (Farmer Name)" required style="flex: 1; padding: 7px; border: 1px solid #c8e6c9; border-radius: 6px; font-size: 12px; outline: none;" />
                <input type="tel" id="f-phone" placeholder="ఫోన్ నంబర్" required style="flex: 1; padding: 7px; border: 1px solid #c8e6c9; border-radius: 6px; font-size: 12px; outline: none;" />
              </div>

              <div style="display: flex; gap: 6px;">
                <input type="text" id="f-crop" placeholder="పంట (Cotton, Paddy...)" required style="flex: 1; padding: 7px; border: 1px solid #c8e6c9; border-radius: 6px; font-size: 12px; outline: none;" />
                <input type="text" id="f-work" placeholder="పని (తీత, కోత...)" required style="flex: 1; padding: 7px; border: 1px solid #c8e6c9; border-radius: 6px; font-size: 12px; outline: none;" />
              </div>

              <div style="display: flex; gap: 6px;">
                <input type="number" id="f-count" placeholder="కూలీల సంఖ్య" required style="flex: 1; padding: 7px; border: 1px solid #c8e6c9; border-radius: 6px; font-size: 12px; outline: none;" />
                <input type="number" id="f-wage" placeholder="రోజు కూలీ (₹)" required style="flex: 1; padding: 7px; border: 1px solid #c8e6c9; border-radius: 6px; font-size: 12px; outline: none;" />
              </div>

              <button type="button" id="loc-btn" style="background: #f1f8e9; color: #2e7d32; border: 1px dashed #2e7d32; border-radius: 6px; padding: 7px; font-size: 12px; font-weight: 600; cursor: pointer;">
                📍 పొలం GPS లొకేషన్ సెట్ చేయండి
              </button>
              <span id="loc-status" style="font-size: 10px; color: #555; text-align: center;"></span>

              <div style="display: flex; justify-content: center; margin-top: 4px;">
                <button type="submit" style="background: #2e7d32; color: #ffffff; border: none; border-radius: 6px; padding: 7px 22px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 5px rgba(46,125,50,0.3);">
                  📢 సబ్మిట్ (Submit)
                </button>
              </div>
            </form>

            <div style="margin-top: 12px; border-top: 1.5px dashed #c8e6c9; padding-top: 8px;">
              <h4 style="margin: 0 0 6px 0; font-size: 12px; color: #1b5e20;">👥 కన్ఫర్మ్ అయిన కూలీలు (${myAcceptedJobs.length}):</h4>
              <div id="accepted-list" style="display: flex; flex-direction: column; gap: 6px;">
                ${myAcceptedJobs.length === 0 ? `
                  <div style="font-size: 11px; color: #777; text-align: center; padding: 6px;">కూలీలు యాక్సెప్ట్ చేయగానే వారి వివరాలు ఇక్కడ కనిపిస్తాయి.</div>
                ` : myAcceptedJobs.map(j => `
                  <div style="border: 1px solid #c8e6c9; border-radius: 6px; padding: 8px; background: #f9fbf9;">
                    <div style="display: flex; justify-content: space-between; font-size: 12px;">
                      <strong>👷 ${j.labourName}</strong>
                      <span style="color: #2e7d32; font-weight: bold;">₹${j.wage}</span>
                    </div>
                    <div style="font-size: 11px; color: #555; margin-top: 2px;">పని: ${j.crop} (${j.workType})</div>
                    <div style="display: flex; gap: 5px; margin-top: 6px;">
                      <a href="tel:${j.labourPhone}" style="flex: 1; text-align: center; background: #e8f5e9; color: #2e7d32; text-decoration: none; border-radius: 4px; padding: 5px; font-size: 11px; font-weight: 600; border: 1px solid #a5d6a7;">📞 కాల్</a>
                      <a href="sms:${j.labourPhone}?body=${encodeURIComponent('నమస్తే, అగ్రీకనెక్ట్ పనికి బయలుదేరండి.')}" style="flex: 1; text-align: center; background: #fffde7; color: #f57f17; text-decoration: none; border-radius: 4px; padding: 5px; font-size: 11px; font-weight: 600; border: 1px solid #fff59d;">✉️ SMS</a>
                      <a href="https://wa.me/91${j.labourPhone}?text=${encodeURIComponent('నమస్తే, అగ్రీకనెక్ట్ పనికి ఎప్పుడు వస్తున్నారు?')}" target="_blank" style="flex: 1.2; text-align: center; background: #e8f8f0; color: #075e54; text-decoration: none; border-radius: 4px; padding: 5px; font-size: 11px; font-weight: 600; border: 1px solid #25d366;">💬 వాట్సాప్</a>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById("loc-btn")?.addEventListener("click", () => {
        const status = document.getElementById("loc-status");
        if (navigator.geolocation) {
          status.innerText = "GPS లొకేషన్ గుర్తిస్తోంది...";
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              currentLat = pos.coords.latitude;
              currentLng = pos.coords.longitude;
              status.innerText = `✅ GPS సెట్ అయింది (${currentLat.toFixed(3)}, ${currentLng.toFixed(3)})`;
            },
            () => {
              status.innerText = "డీఫాల్ట్ GPS సెట్ అయింది.";
            }
          );
        }
      });

      document.getElementById("farmer-form")?.addEventListener("submit", (e) => {
        e.preventDefault();
        const newJob = {
          id: "JOB-" + Date.now(),
          farmerName: document.getElementById("f-name").value,
          farmerPhone: document.getElementById("f-phone").value,
          crop: document.getElementById("f-crop").value,
          workType: document.getElementById("f-work").value,
          count: document.getElementById("f-count").value,
          wage: document.getElementById("f-wage").value,
          distanceKm: (Math.random() * 4 + 1.2).toFixed(1),
          lat: currentLat,
          lng: currentLng,
          status: "Open",
          labourName: "",
          labourPhone: ""
        };

        appJobs.unshift(newJob);
        e.target.reset();
        renderFarmerWidget();
        renderLabourWidget();
        alert("📢 పని కూలీల డ్యాష్‌బోర్డ్‌లో పోస్ట్ చేయబడింది!");
      });
    }

    // 2. Labour Widget (Light Blue Header, SMS, Call, WhatsApp, Maps)
    function renderLabourWidget() {
      const container = document.getElementById("labour-jobs-container");
      if (!container) return;

      container.innerHTML = `
        <div style="background: #ffffff; border: 1.5px solid #64b5f6; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.06);">
          <div style="background: #e3f2fd; border-bottom: 1.5px solid #90caf9; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; color: #0d47a1; font-size: 14px; font-weight: 700;">
              👷 కూలీల డ్యాష్‌బోర్డ్ (5-10 KM Jobs)
            </h3>
            <span style="font-size: 10px; background: #bbdefb; color: #0d47a1; padding: 2px 7px; border-radius: 4px; font-weight: 700;">Live Feed</span>
          </div>

          <div style="padding: 12px;">
            <div id="jobs-feed" style="display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto;">
              ${appJobs.length === 0 ? `
                <div style="text-align: center; color: #666; font-size: 12px; padding: 16px; background: #fbfbfb; border-radius: 6px; border: 1px dashed #ddd;">
                  📢 ప్రస్తుతం కొత్త పనులు లేవు. పై రైతు ఫారంలో పోస్ట్ చేయగానే ఇక్కడ కనిపిస్తాయి.
                </div>
              ` : appJobs.map(j => {
                const isConf = j.status === "Confirmed";
                const lat = typeof j.lat === 'number' ? j.lat : 17.9784;
                const lng = typeof j.lng === 'number' ? j.lng : 79.5941;

                return `
                  <div style="border: 1px solid ${isConf ? '#81c784' : '#90caf9'}; border-radius: 8px; padding: 10px; background: ${isConf ? '#f9fdf9' : '#fcfdff'};">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                      <div>
                        <strong style="color: #0d47a1; font-size: 13px;">${j.crop} -${j.workType}</strong>
                        <div style="font-size: 11px; color: #555; margin-top: 2px;">
                          రైతు: <b>${j.farmerName \vert{}\vert{} 'రైతు'}</b> \vert{} కావాల్సిన వారు: <b>${j.count || 1}</b>
                        </div>
                      </div>
                      <div style="text-align: right;">
                        <span style="font-size: 14px; font-weight: 700; color: #2e7d32;">₹${j.wage}/రోజు</span>
                        <div style="font-size: 10px; color: #e65100; font-weight: 600;">📍 ${j.distanceKm || '2.5'} కి.మీ</div>
                      </div>
                    </div>

                    ${!isConf ? `
                      <div style="margin-top: 8px;">
                        <button onclick="handleAcceptJob('${j.id}')" style="background: #1976d2; color: #ffffff; border: none; border-radius: 5px; padding: 7px; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%;">
                          ✅ పని యాక్సెప్ట్ చేయండి
                        </button>
                      </div>
                    ` : `
                      <div style="margin-top: 8px; border-top: 1px solid #e0e0e0; padding-top: 8px;">
                        <div style="font-size: 11px; color: #2e7d32; font-weight: 700; margin-bottom: 6px;">
                          🎉 మీరు పనిని ఒప్పుకున్నారు! రైతుతో మాట్లాడండి:
                        </div>
                        
                        <div style="display: flex; gap: 4px;">
                          <a href="tel:${j.farmerPhone || '9876543210'}" style="flex: 1; text-align: center; background: #e8f5e9; color: #2e7d32; text-decoration: none; border-radius: 4px; padding: 6px 2px; font-size: 11px; font-weight: 600; border: 1px solid #a5d6a7;">
                            📞 కాల్
                          </a>
                          <a href="sms:${j.farmerPhone || '9876543210'}?body=${encodeURIComponent('నమస్తే, నేను అగ్రీకనెక్ట్ పని ఒప్పుకున్నాను. బయలుదేరుతున్నాను.')}" style="flex: 1; text-align: center; background: #fffde7; color: #f57f17; text-decoration: none; border-radius: 4px; padding: 6px 2px; font-size: 11px; font-weight: 600; border: 1px solid #fff59d;">
                            ✉️ SMS
                          </a>
                          <a href="https://wa.me/91${j.farmerPhone || '9876543210'}?text=${encodeURIComponent('నమస్తే, నేను పని ఒప్పుకున్నాను. బయలుదేరుతున్నాను.')}" target="_blank" style="flex: 1.1; text-align: center; background: #e8f8f0; color: #075e54; text-decoration: none; border-radius: 4px; padding: 6px 2px; font-size: 11px; font-weight: 600; border: 1px solid #25d366;">
                            💬 వాట్సాప్
                          </a>
                          <button id="mbtn-${j.id}" onclick="handleToggleMap('${j.id}')" style="flex: 1.2; background: #fff3e0; color: #e65100; border: 1px solid #ffb74d; border-radius: 4px; padding: 6px 2px; font-size: 11px; font-weight: 600; cursor: pointer;">
                            🗺️ దారి Map (ON)
                          </button>
                        </div>

                        <div id="map-${j.id}" style="display: none; margin-top: 8px; background: #f5f5f5; border: 1px dashed #bdbdbd; border-radius: 6px; padding: 8px; text-align: center;">
                          <div style="font-size: 11px; color: #333; margin-bottom: 6px;">
                            📍 పొలం లొకేషన్: (${lat.toFixed(3)}, ${lng.toFixed(3)})
                          </div>
                          <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" style="display: inline-block; background: #2e7d32; color: #ffffff; text-decoration: none; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: 600;">
                            🚀 Google Maps లో దారి చూడండి
                          </a>
                        </div>
                      </div>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    window.handleAcceptJob = function(id) {
      const name = prompt("మీ పేరు (Labour Name):", "రాము");
      if (!name) return;
      const phone = prompt("మీ ఫోన్ నంబర్:", "9876543210");
      if (!phone) return;

      const job = appJobs.find(j => j.id === id);
      if (job) {
        job.status = "Confirmed";
        job.labourName = name;
        job.labourPhone = phone;
        alert("🎉 పని ఖరారైంది! రైతుకు మీ వివరాలు చేరాయి.");
        renderLabourWidget();
        renderFarmerWidget();
      }
    };

    window.handleToggleMap = function(id) {
      const box = document.getElementById("map-" + id);
      const btn = document.getElementById("mbtn-" + id);
      if (!box || !btn) return;

      if (box.style.display === "none" || box.style.display === "") {
        box.style.display = "block";
        btn.innerText = "✖️ దారి Map (OFF)";
        btn.style.background = "#ffebee";
        btn.style.color = "#c62828";
      } else {
        box.style.display = "none";
        btn.innerText = "🗺️ దారి Map (ON)";
        btn.style.background = "#fff3e0";
        btn.style.color = "#e65100";
      }
    };

    // Load both directly
    renderFarmerWidget();
    renderLabourWidget();
  </script>

</body>
</html>
