<!-- farmer/farmer.html - Dedicated Clean Farmer Templates -->

<!-- 1. రైతు ల్యాండింగ్ కార్డ్ టెంప్లేట్ (లాగిన్ కానప్పుడు కనిపించే ఒరిజినల్ కార్డ్) -->
<template id="farmer-landing-template">
  <div class="agri-landing-card farmer-border">
    <div class="agri-card-header">
      <span class="agri-icon">🌾</span>
      <strong class="agri-title-farmer">రైతు సోదరుల కోసం (Farmer)</strong>
    </div>
    <ul class="agri-card-desc-list">
      <li>మీ పొలం పనులకు కూలీలను వెంటనే బుక్ చేసుకోండి.</li>
      <li>ఉచిత జాబ్ పోస్టింగ్ & మార్కెట్ లైవ్ ధరల సమాచారం.</li>
      <li>స్మార్ట్ ఆటో-స్విచ్: సొంత పని లేనప్పుడు కూలీ మోడ్‌కి మారే సదుపాయం.</li>
    </ul>
    <button type="button" onclick="window.openLoginModal('FARMER')" class="agri-landing-btn farmer-btn-bg">
      రైతుగా Login / నమోదు అవ్వండి ➔
    </button>
  </div>
</template>

<!-- 2. రైతు మెయిన్ డాష్‌బోర్డ్ షెల్ టెంప్లేట్ -->
<template id="farmer-dashboard-template">
  <div class="farmer-card">
    <div class="farmer-card-header">
      <h3>👨‍🌾 రైతు Dashboard</h3>
      <span class="badge-live">Live</span>
    </div>

    <!-- 4 Tabs Bar -->
    <div class="eq-tabs-bar">
      <button id="tab-btn-labour" type="button" class="eq-tab-btn active" onclick="window.switchFarmerTab('labour')">
        👥 కూలీలు
      </button>
      <button id="tab-btn-equipment" type="button" class="eq-tab-btn" onclick="window.switchFarmerTab('equipment')">
        🚜 పరికరాలు
      </button>
      <button id="tab-btn-seeds" type="button" class="eq-tab-btn" onclick="window.switchFarmerTab('seeds')">
        🌱 విత్తనాలు
      </button>
      <button id="tab-btn-transport" type="button" class="eq-tab-btn" onclick="window.switchFarmerTab('transport')">
        🚚 రవాణా
      </button>
<button id="tab-btn-spot" type="button" class="eq-tab-btn pill-spot" onclick="window.FarmerModule.openSpotModal()">
          ⚡ స్పాట్ బుకింగ్
        </button>
    </div>

    <div class="farmer-card-body">
      <!-- 4 Tab Panes -->
      <div id="farmer-pane-labour" class="farmer-pane">
        <div id="farmer-labour-form-wrapper"></div>
        <div id="farmer-accepted-section-wrapper"></div>
      </div>
      <div id="farmer-pane-equipment" class="farmer-pane is-hidden" style="display: none;"></div>
      <div id="farmer-pane-seeds" class="farmer-pane is-hidden" style="display: none;"></div>
      <div id="farmer-pane-transport" class="farmer-pane is-hidden" style="display: none;"></div>

      <!-- బుకింగ్ రికార్డులు కనిపించే బాక్స్ -->
      <div id="farmer-booking-records"></div>
    </div>
  </div>
</template>

<!-- 3. పని పోస్ట్ చేసే ఫారమ్ టెంప్లేట్ -->
<template id="farmer-labour-form-template">
  <form id="farmer-form" class="farmer-form">
    <div class="form-row">
      <input type="text" id="f-name" class="farmer-input" placeholder="మీ పేరు" required />
      <input type="tel" id="f-phone" class="farmer-input" placeholder="ఫోన్ నంబర్" required />
    </div>

    <div class="form-row">
      <input type="text" id="f-crop" class="farmer-input" placeholder="పంట (ఉదా: వరి, పత్తి)" required />
      <input type="text" id="f-work" class="farmer-input" placeholder="పని (ఉదా: నాట్లు, కోత)" required />
    </div>

    <div class="form-row-spaced">
      <input type="number" id="f-count" class="farmer-input" placeholder="కూలీల సంఖ్య" required min="1" />
      <input type="number" id="f-wage" class="farmer-input" placeholder="రోజు కూలీ (₹)" required min="100" />
    </div>

    <div class="form-action-row">
      <input 
        type="text" 
        id="f-date" 
        class="input-date-fixed"
        placeholder="📅 పని తేదీ" 
        onfocus="(this.type='date'); this.showPicker && this.showPicker();" 
        onblur="if(!this.value) this.type='text';" 
        required 
      />
      <div class="gps-wrapper">
        <button type="button" id="loc-btn" class="btn-gps">📍 పొలం GPS</button>
        <span id="loc-status" class="gps-status-text"></span>
      </div>
      <button type="button" id="f-village-btn" class="btn-village">🏛️ స్థానిక పరిధి</button>
    </div>

    <div class="farmer-submit-row">
      <button type="submit" class="btn-farmer-post">
        📢 Submit కూలీల కోసం (Post Alert)
      </button>
    </div>
  </form>
</template>

<!-- 4. జాబ్ పోస్టింగ్ పాప్-అప్ మోడల్ టెంప్లేట్ -->
<template id="farmer-job-modal-template">
  <div id="farmerJobModal" class="fjm-modal-overlay">
    <div class="fjm-modal-card">
      <div class="fjm-modal-header">
        <h4 class="fjm-modal-title">🌾 రైతు పనిని పోస్ట్ చేయండి</h4>
        <span onclick="window.closeFarmerJobModal()" class="fjm-close-btn">&times;</span>
      </div>

      <form id="farmerJobForm" onsubmit="window.handleFarmerJobSubmit(event)" class="fjm-form">
        <div>
          <label class="fjm-label">రైతు పేరు:</label>
          <input type="text" id="fjm_name" required placeholder="మీ పేరు" class="fjm-input">
        </div>

        <div>
          <label class="fjm-label">ఫోన్ నంబర్:</label>
          <input type="tel" id="fjm_phone" required pattern="[0-9]{10}" placeholder="10 అంకెల నంబర్" class="fjm-input">
        </div>

        <div class="fjm-grid-2">
          <div>
            <label class="fjm-label">పంట రకం:</label>
            <select id="fjm_crop" class="fjm-select">
              <option value="వరి (Paddy)">వరి</option>
              <option value="పత్తి (Cotton)">పత్తి</option>
              <option value="మిరప (Chilli)">మిరప</option>
              <option value="మొక్కజొన్న">మొక్కజొన్న</option>
              <option value="ఇతర">ఇతర పంట</option>
            </select>
          </div>
          <div>
            <label class="fjm-label">పని రకం:</label>
            <select id="fjm_work" class="fjm-select">
              <option value="వరి నాట్లు">వరి నాట్లు</option>
              <option value="కలుపు తీత">కలుపు తీత</option>
              <option value="పంట కోత">పంట కోత</option>
              <option value="మందు స్ప్రేయింగ్">మందు స్ప్రేయింగ్</option>
              <option value="పత్తి ఏరడం">పత్తి ఏరడం</option>
            </select>
          </div>
        </div>

        <div class="fjm-grid-2">
          <div>
            <label class="fjm-label">ఎంతమంది కూలీలు?:</label>
            <input type="number" id="fjm_required" min="1" max="50" value="5" required class="fjm-input">
          </div>
          <div>
            <label class="fjm-label">రోజు కూలీ (₹):</label>
            <input type="number" id="fjm_wage" min="100" step="50" value="450" required class="fjm-input">
          </div>
        </div>

        <div class="fjm-grid-2">
          <div>
            <label class="fjm-label">పని తేదీ:</label>
            <input type="date" id="fjm_date" required class="fjm-input">
          </div>
          <div>
            <label class="fjm-label">గ్రామం / పొలం:</label>
            <input type="text" id="fjm_village" required placeholder="ఊరి పేరు" class="fjm-input">
          </div>
        </div>

        <div>
          <label class="fjm-label">రవాణా సదుపాయం:</label>
          <select id="fjm_trans" class="fjm-select">
            <option value="needed">🛺 రైతు రవాణా ఏర్పాటు చేస్తారు</option>
            <option value="own">🛵 కూలీల సొంత బండి ఉండాలి</option>
          </select>
        </div>

        <div class="fjm-btn-row">
          <button type="button" onclick="window.closeFarmerJobModal()" class="fjm-btn-cancel">రద్దు</button>
          <button type="submit" class="fjm-btn-submit">🚀 అలర్ట్ పంపండి</button>
        </div>
      </form>
    </div>
  </div>
</template>

<!-- 5. వెహికల్ / పరికరాల బుకింగ్ మోడల్ టెంప్లేట్ -->
<template id="farmer-booking-modal-template">
  <div id="booking-modal" class="booking-modal-overlay">
    <div class="booking-modal-box">
      <div class="booking-modal-header">
        <h4>📋 బుకింగ్ అభ్యర్థన</h4>
        <button type="button" class="btn-modal-close" onclick="window.closeBookingModal()">✖</button>
      </div>
      <div class="booking-item-highlight">
        <strong>వస్తువు:</strong> <span id="b-item-name">--</span> <br>
        <strong>ధర:</strong> <span id="b-item-rate" class="booking-rate-text">--</span>
      </div>
      <form id="booking-request-form">
        <div class="modal-form-group">
          <label>📅 కావలసిన తేదీ:</label>
          <input type="date" id="book-date" class="modal-input" required />
        </div>
        <div class="modal-form-group">
          <label>⏱️ వ్యవధి / విస్తీర్ణం (గంటలు / ఎకరాలు / ట్రిప్పులు):</label>
          <input type="text" id="book-duration" class="modal-input" placeholder="ఉదా: 3 గంటలు లేదా 2 ఎకరాలు" required />
        </div>
        <button type="submit" class="btn-confirm-booking">✅ అభ్యర్థన పంపండి</button>
      </form>
    </div>
  </div>
</template>
