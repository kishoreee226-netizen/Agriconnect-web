<!-- role/role.html - Smart Profile Banner & Multi-Role Switcher Templates -->

<!-- 1. లాగిన్ అయిన యూజర్ ప్రొఫైల్ బ్యానర్ టెంప్లేట్ -->
<template id="role-profile-banner-template">
  <div class="user-profile-banner">
    <div class="profile-banner-left">
      <div class="profile-avatar-circle">👤</div>
      <div class="profile-info-block">
        <div class="user-name-line">
          <strong class="user-name-text">యూజర్ పేరు</strong>
          <span class="profile-banner-badge">రైతు (Farmer)</span>
        </div>
        <div class="user-meta-line">
          <span class="meta-item"><span class="meta-icon">📞</span> <span class="user-phone-text">--</span></span>
          <span class="meta-dot">•</span>
          <span class="meta-item"><span class="meta-icon">📍</span> <span class="user-village-text">--</span></span>
        </div>
      </div>
    </div>
    <div class="profile-banner-right">
      <button type="button" class="logout-btn-minimal" onclick="window.logoutUser()" title="Logout">
        <span class="logout-icon">🚪</span> లాగౌట్
      </button>
    </div>
  </div>
</template>

<!-- 2. రైతు డాష్‌బోర్డ్ కోసం మోడ్ స్విచర్ ట్యాబ్స్ టెంప్లేట్ -->
<template id="role-dual-switch-template">
  <div class="role-switch-container">
    <button type="button" id="role-btn-farmer" class="role-switch-btn role-switch-farmer active" onclick="window.switchRoleMode('FARMER')">
      🌾 Farmer mode (రైతు)
    </button>
    <button type="button" id="role-btn-labour" class="role-switch-btn role-switch-labour" onclick="window.switchRoleMode('LABOUR')">
      👷 Labour mode (కూలీ)
    </button>
    <button type="button" id="role-btn-provider" class="role-switch-btn role-switch-provider" onclick="window.switchRoleMode('PROVIDER')">
      🤝 Yajamani mode (యజమాని)
    </button>
  </div>
</template>
