<!-- role/role.html - User Profile Banner & Role Switcher Templates -->

<!-- 1. Logged-in User Profile Banner Template -->
<template id="role-profile-banner-template">
  <div class="user-profile-banner">
    <div class="profile-banner-info">
      <div class="profile-banner-name">
        <span class="user-name-text">👤 వినియోగదారుడు</span>
        <span class="profile-banner-badge"></span>
      </div>
      <div class="profile-banner-details">
        <span class="user-phone-text">📞 </span> &nbsp;|&nbsp; 📍 <b class="user-village-text"></b>
      </div>
    </div>
    <button type="button" class="profile-banner-logout-btn" onclick="window.RoleController.logoutUser()">లాగౌట్ (Logout)</button>
  </div>
</template>

<!-- 2. Dual-Role Switch Bar (For Farmers) -->
<template id="role-dual-switch-template">
  <div class="role-switch-container">
    <button type="button" id="role-btn-farmer" onclick="window.RoleController.switchRoleMode('FARMER')" class="role-switch-btn role-switch-farmer">
      🌾 Farmer mode (రైతు)
    </button>
    <button type="button" id="role-btn-labour" onclick="window.RoleController.switchRoleMode('LABOUR')" class="role-switch-btn role-switch-labour">
      👷 Labour mode (కూలీ)
    </button>
      <button type="button" id="role-btn-provider" onclick="window.RoleController.switchRoleMode('PROVIDER')" class="role-switch-btn role-switch-provider">
        🛠️ Provider mode (యజమాని)
      </button>
  </div>
</template>

<!-- 3. Guest / Landing View Role Cards -->
<template id="role-guest-cards-template">
  <div class="guest-role-cards-container">
    <!-- 1. రైతు కార్డు -->
    <div onclick="window.openLoginModal('FARMER')" class="guest-card guest-card-farmer">
      <div class="guest-card-icon">🌾</div>
      <b class="guest-card-title">రైతు</b>
      <span class="guest-card-sub">లాగిన్ / రిజిస్టర్</span>
    </div>

    <!-- 2. కూలీ కార్డు -->
    <div onclick="window.openLoginModal('LABOUR')" class="guest-card guest-card-labour">
      <div class="guest-card-icon">👷</div>
      <b class="guest-card-title">కూలీ</b>
      <span class="guest-card-sub">లాగిన్ / పనులు</span>
    </div>

    <!-- 3. యజమాని / ప్రొవైడర్ కార్డు -->
    <div onclick="window.openLoginModal('PROVIDER')" class="guest-card guest-card-provider">
      <div class="guest-card-icon">🚜</div>
      <b class="guest-card-title">యజమాని</b>
      <span class="guest-card-sub">ట్రాక్టర్ / విత్తనాలు</span>
    </div>
  </div>
</template>
