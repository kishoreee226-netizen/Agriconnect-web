<!-- role/role.html - User Profile Banner & Role Switcher Templates -->

<!-- 1. Logged-in User Profile Banner Template -->
<template id="role-profile-banner-template">
  <div class="user-profile-banner">
    <div class="profile-banner-info">
      <div class="profile-banner-name">
        <span class="user-name-text">👤 వినియోగదారుడు</span>
        <span class="profile-banner-badge"></span>
      </div>
      <div class="profile-banner-details">
        <span class="user-phone-text">📞 </span> &nbsp;|&nbsp; 📍 <b class="user-village-text"></b>
      </div>
    </div>
    <button type="button" class="profile-banner-logout-btn" onclick="window.RoleController.logoutUser()">లాగౌట్ (Logout)</button>
  </div>
</template>

<!-- 2. Dual-Role Switch Bar (For Farmers) -->
<template id="role-dual-switch-template">
  <div class="role-switch-container">
    <button type="button" id="role-btn-farmer" onclick="window.RoleController.switchRoleMode('FARMER')" class="role-switch-btn role-switch-farmer">
      🌾 Farmer mode (రైతు)
    </button>
    <button type="button" id="role-btn-labour" onclick="window.RoleController.switchRoleMode('LABOUR')" class="role-switch-btn role-switch-labour">
      👷 Labour mode (కూలీ)
    </button>
      <button type="button" id="role-btn-provider" onclick="window.RoleController.switchRoleMode('PROVIDER')" class="role-switch-btn role-switch-provider">
        🛠️ Provider mode (యజమాని)
      </button>
  </div>
</template>

<!-- 3. Guest / Landing View Role Cards -->
<template id="role-guest-cards-template">
  <div class="guest-role-cards-container" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0;">
    <!-- 1. రైతు కార్డు -->
    <div onclick="window.openLoginModal('FARMER')" style="background: #f0fdf4; border: 1.5px solid #86efac; border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.04);">
      <div style="font-size: 26px; margin-bottom: 4px;">🌾</div>
      <b style="font-size: 13px; color: #166534; display: block;">రైతు</b>
      <span style="font-size: 10px; color: #15803d;">లాగిన్ / రిజిస్టర్</span>
    </div>

    <!-- 2. కూలీ కార్డు -->
    <div onclick="window.openLoginModal('LABOUR')" style="background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.04);">
      <div style="font-size: 26px; margin-bottom: 4px;">👷</div>
      <b style="font-size: 13px; color: #9a3412; display: block;">కూలీ</b>
      <span style="font-size: 10px; color: #c2410c;">లాగిన్ / పనులు</span>
    </div>

    <!-- 3. యజమాని / ప్రొవైడర్ కార్డు -->
    <div onclick="window.openLoginModal('PROVIDER')" style="background: #f0f9ff; border: 1.5px solid #bae6fd; border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.04);">
      <div style="font-size: 26px; margin-bottom: 4px;">🚜</div>
      <b style="font-size: 13px; color: #0369a1; display: block;">యజమాని</b>
      <span style="font-size: 10px; color: #0284c7;">ట్రాక్టర్ / విత్తనాలు</span>
    </div>
  </div>
</template>
