<!-- labour/labour.html - Dedicated Clean Labour Module Templates -->

<!-- 1. కూలీ ల్యాండింగ్ కార్డ్ టెంప్లేట్ (లాగిన్ కానప్పుడు కనిపించే ఒరిజినల్ కార్డ్) -->
<template id="labour-landing-template">
  <div class="agri-landing-card labour-border">
    <div class="agri-card-header">
      <span class="agri-icon">👷</span>
      <strong class="agri-title-labour">కూలీల కోసం (Labour)</strong>
    </div>
    <ul class="agri-card-desc-list">
      <li>మీ గ్రామం మరియు 5-10 కి.మీ పరిధిలోని రోజువారీ పనులను వెతుక్కోండి.</li>
      <li>రోజువారీ కూలీ వివరాలు, డైరెక్ట్ ఫోన్ / వాట్సాప్ కాలింగ్.</li>
      <li>మీ వేతనాల లెక్కల కోసం సులభమైన వ్యక్తిగత వాలెట్.</li>
    </ul>
    <button type="button" onclick="window.openLoginModal('LABOUR')" class="agri-landing-btn labour-btn-bg">
      కూలీగా Login / నమోదు అవ్వండి ➔
    </button>
  </div>
</template>

<!-- 2. కూలీ మెయిన్ డాష్‌బోర్డ్ టెంప్లేట్ -->
<template id="labour-dashboard-template">
  <div class="labour-card">
    <!-- Duty Switch Bar -->
    <div class="labour-duty-bar">
      <div class="labour-duty-left">
        <span class="labour-duty-label">కూలీ డ్యూటీ:</span>
        <button type="button" id="btn-duty-toggle" onclick="window.toggleLabourDutyStatus()" class="btn-duty-toggle">
          <span id="duty-toggle-text">🟢 డ్యూటీ ON (లైవ్)</span>
        </button>
      </div>
      <button type="button" onclick="window.openLabourProfileModal()" class="btn-labour-skills">
        ⚙️ నా పనులు మార్చుకోండి
      </button>
    </div>

    <!-- ⚡ అత్యవసర స్పాట్ అలర్ట్స్ విభాగం (రైతు SOS పంపినప్పుడు మాత్రమే కనిపిస్తుంది) -->
    <div id="labour-spot-alerts-container" class="labour-spot-alerts-wrapper is-hidden"></div>

    <!-- Job Alerts Section -->
    <div class="labour-alerts-section">
      <div class="labour-alerts-header">
        <span>📢 సమీప రైతుల పనుల అలర్ట్స్:</span>
        <span id="labour-alerts-badge" class="labour-alerts-badge">0 పనులు</span>
      </div>

      <!-- Duty OFF Notice Box -->
      <div id="labour-duty-off-box" class="labour-duty-off-card is-hidden">
        🛑 మీ డ్యూటీ <b>OFF</b> లో ఉంది.<br>
        పనుల అలర్ట్స్ అందుకోవడానికి మరియు రైతులకు లైవ్‌గా కనిపించడానికి పైన డ్యూటీ <b>ON</b> చేసుకోండి.
      </div>

      <!-- Empty Jobs Notice Box -->
      <div id="labour-empty-jobs-box" class="labour-empty-jobs-card is-hidden">
        ప్రస్తుతం మీ ప్రాంతంలో కొత్త పనుల అలర్ట్స్ ఏవీ లేవు.
      </div>

      <!-- Live Job Cards Container -->
      <div id="labour-open-jobs-list" class="labour-open-jobs-list"></div>
    </div>

    <!-- Confirmed Work Section -->
    <div id="labour-confirmed-section" class="labour-confirmed-section is-hidden">
      <h4 class="labour-confirmed-heading">🎉 మీరు ఒప్పుకున్న ఖరారైన పనులు:</h4>
      <div id="labour-confirmed-list" class="labour-confirmed-list"></div>
    </div>
  </div>
</template>

<!-- 3. ⚡ రైతు అత్యవసర స్పాట్ బుకింగ్ అలర్ట్ కార్డ్ టెంప్లేట్ -->
<template id="labour-spot-card-template">
  <div class="labour-spot-card">
    <div class="labour-spot-card-top">
      <div>
        <span class="badge-sos-blink">🚨 తక్షణ అత్యవసరం (SOS)</span>
        <h4 class="labour-spot-title"></h4>
        <div class="labour-spot-farmer-info"></div>
        <div class="labour-spot-desc"></div>
      </div>
      <div class="labour-spot-wage"></div>
    </div>
    <div class="labour-spot-actions">
      <button type="button" class="btn-spot-accept">✅ అత్యవసర పనిని స్వీకరించండి</button>
    </div>
  </div>
</template>

<!-- 4. సాధారణ జాబ్ కార్డ్ టెంప్లేట్ -->
<template id="labour-job-card-template">
  <div class="labour-job-card" data-village="">
    <div class="labour-job-card-top">
      <div>
        <h4 class="labour-job-title"></h4>
        <div class="labour-job-farmer-info"></div>
        <div class="labour-job-schedule"></div>
        <div class="labour-job-quota"></div>
      </div>
      <div class="labour-job-wage"></div>
    </div>
    <div class="labour-job-actions">
      <button type="button" class="btn-job-accept">✅ పని Accept చేయండి</button>
      <button type="button" class="btn-job-reject">❌ తిరస్కరించు</button>
      <button type="button" disabled class="btn-job-accepted-disabled is-hidden">
        ✅ మీరు ఇప్పటికే అంగీకరించారు
      </button>
    </div>
  </div>
</template>

<!-- 5. కన్ఫర్మ్ అయిన పని కార్డ్ టెంప్లేట్ -->
<template id="labour-confirmed-card-template">
  <div class="labour-confirmed-card">
    <div class="labour-confirmed-title"></div>
    <div class="labour-confirmed-sub"></div>
    <div class="labour-confirmed-btn-row">
      <a class="labour-cbtn labour-cbtn-call">📞 రైతుకు కాల్</a>
      <a target="_blank" class="labour-cbtn labour-cbtn-wa">💬 వాట్సాప్</a>
      <a target="_blank" class="labour-cbtn labour-cbtn-map">🗺️ రూట్ Map</a>
    </div>
  </div>
</template>

<!-- 6. కూలీ ప్రొఫైల్ & స్కిల్స్ పాప్-అప్ మోడల్ టెంప్లేట్ -->
<template id="labour-profile-modal-template">
  <div id="labourProfileModal" class="lpm-modal-overlay">
    <div class="lpm-modal-card">
      <div class="lpm-modal-header">
        <h4 class="lpm-modal-title">👷 నా కూలీ వివరాలు & పనులు</h4>
        <span onclick="window.closeLabourProfileModal()" class="lpm-close-btn">&times;</span>
      </div>

      <form id="labourProfileForm" onsubmit="window.handleLabourProfileSubmit(event)" class="lpm-form">
        <div class="lpm-form-group">
          <label class="lpm-label">కూలీ / మేస్త్రీ పేరు:</label>
          <input type="text" id="lpf_name" required class="lpm-input" placeholder="మీ పేరు">
        </div>

        <div class="lpm-form-group">
          <label class="lpm-label">ఫోన్ నంబర్:</label>
          <input type="tel" id="lpf_phone" required pattern="[0-9]{10}" class="lpm-input" placeholder="10 అంకెల మొబైల్">
        </div>

        <div class="lpm-grid-2">
          <div>
            <label class="lpm-label">గ్రామం / ప్రాంతం:</label>
            <input type="text" id="lpf_village" required class="lpm-input" placeholder="గ్రామం">
          </div>
          <div>
            <label class="lpm-label">బృందం సభ్యులు:</label>
            <input type="number" id="lpf_count" min="1" value="1" required class="lpm-input">
          </div>
        </div>

        <div class="lpm-grid-2">
          <div>
            <label class="lpm-label">రోజు కూలీ (₹):</label>
            <input type="number" id="lpf_wage" min="100" step="50" value="450" required class="lpm-input">
          </div>
          <div>
            <label class="lpm-label">సొంత బండి ఉందా?</label>
            <select id="lpf_trans" class="lpm-select">
              <option value="yes">🛵 ఉంది</option>
              <option value="no">❌ లేదు (రవాణా కావాలి)</option>
            </select>
          </div>
        </div>

        <div class="lpm-form-group">
          <label class="lpm-label">మీకు వచ్చిన పనులు (టిక్ చేయండి):</label>
          <div id="lpm-skills-box" class="lpm-skills-box"></div>
        </div>

        <div class="lpm-btn-row">
          <button type="button" onclick="window.closeLabourProfileModal()" class="lpm-btn-cancel">రద్దు</button>
          <button type="submit" class="lpm-btn-save">💾 వివరాలు సేవ్ చేయండి</button>
        </div>
      </form>
    </div>
  </div>
</template>
