<!-- provider/provider.html - Dedicated Clean Provider Template -->

<!-- 1. Provider Landing Card Template -->
<template id="provider-landing-template">
  <div class="agri-landing-card provider-border">
    <div class="agri-card-header">
      <span class="agri-icon">🤝</span>
      <strong class="agri-title-provider">పరికరాలు, రవాణా & విత్తనాల యజమానుల సేవా కేంద్రం</strong>
    </div>
    <p class="agri-card-subtext">
      ట్రాక్టర్లు, హార్వెస్టర్లు, రవాణా వాహనాలు లేదా విత్తనాలు/ఎరువుల యజమానులు తమ సేవలను అద్దెకు/అమ్ముకానికి ఇక్కడ సులభంగా జోడించవచ్చు.
    </p>
    <ul class="agri-card-desc-list">
      <li>రైతుల నుండి నేరుగా బుకింగ్‌లు & ఆర్డర్‌లు పొందండి.</li>
      <li>మీ పరికరాలు, రవాణా రేట్లు మీరే నిర్ణయించుకోండి.</li>
      <li>కమిషన్ లేకుండా నేరుగా కస్టమర్‌తో ఫోన్ / వాట్సాప్ సంప్రదింపులు.</li>
    </ul>
    <button type="button" onclick="window.AuthModule.open({ role: 'PROVIDER' })" class="agri-landing-btn provider-btn-bg">
      యజమానిగా Login / సేవలను జోడించండి ➔
    </button>
  </div>
</template>

<!-- 2. Provider Dashboard Shell Template -->
<template id="provider-dashboard-template">
  <div class="provider-dashboard-card">
    <h3 class="provider-dash-title"></h3>
    <p class="provider-dash-desc"></p>
    
    <div class="provider-add-service-btn">
      <span class="provider-add-service-text">➕ కొత్త వస్తువును / సేవను జోడించండి</span>
      <p class="provider-add-service-subtext">వివరాలు నమోదు చేయడానికి ఇక్కడ నొక్కండి</p>
    </div>

    <div class="provider-items-box-wrapper"></div>
    <div class="provider-incoming-requests-wrapper"></div>
  </div>
</template>

<!-- 3. Provider Item Row Template -->
<template id="provider-item-row-template">
  <div class="pitem-card-row">
    <div>
      <div class="pitem-card-title"></div>
      <div class="pitem-card-details">
        ధర / అద్దె: <b class="pitem-price-text"></b> | <span class="pitem-status-text"></span>
      </div>
    </div>
    <button type="button" class="pitem-delete-btn">తీసివేయి</button>
  </div>
</template>

<!-- 4. Provider Order Card Template -->
<template id="provider-order-card-template">
  <div class="porders-card">
    <div class="porders-card-top">
      <span class="porders-type-tag"></span>
      <span class="porders-time-text"></span>
    </div>
    <div class="porders-veh-name"></div>
    <div class="porders-work-details">
      <div>పని: <b class="porders-work-size"></b> &nbsp;|&nbsp; సమయం: <b class="porders-schedule"></b></div>
      <div>రైతు: <b class="porders-farmer-name"></b>, గ్రామం: <b class="porders-village"></b></div>
    </div>
    <div class="porders-btn-row">
      <a class="porders-action-btn porders-call-btn">📞 రైతుకు కాల్</a>
      <a target="_blank" class="porders-action-btn porders-map-btn hidden">🗺️ పొలం మ్యాప్</a>
      <button type="button" class="porders-action-btn porders-accept-btn">✅ ఒప్పుకోండి (Accept)</button>
      <span class="porders-accepted-badge hidden">ఆర్డర్ స్వీకరించబడింది</span>
    </div>
  </div>
</template>

<!-- 5. Add Service / Item Modal Popup -->
<div id="provider-item-modal" class="pitem-modal-overlay" style="display: none;">
  <div class="pitem-modal-card">
    <button type="button" onclick="window.ProviderModule.closeAddModal()" class="provider-close-btn" aria-label="Close">✕</button>
    <h3 id="pitem-modal-dynamic-title" class="pitem-modal-title">🚜 వస్తువు / పరికరం వివరాలు</h3>

    <form id="provider-add-item-form" onsubmit="window.ProviderModule.handleSaveItem(event)">
      <div class="provider-form-group">
        <label id="pitem-lbl-1" class="provider-form-label">పేరు / మోడల్:</label>
        <input type="text" id="item-field-1" required class="provider-form-input" />
      </div>

      <div class="provider-form-group">
        <label id="pitem-lbl-2" class="provider-form-label">ధర / అద్దె (₹):</label>
        <input type="text" id="item-field-2" required class="provider-form-input" />
      </div>

      <div class="provider-form-group last">
        <label id="pitem-lbl-3" class="provider-form-label">లభ్యత / సామర్థ్యం:</label>
        <select id="item-field-3-select" class="provider-form-input">
          <option value="అందుబాటులో ఉంది (Available)">అందుబాటులో ఉంది (Available)</option>
          <option value="బిజీగా ఉంది (Busy)">బిజీగా ఉంది (Busy)</option>
        </select>
       <input type="text" id="item-field-3-text" class="provider-form-input" style="display: none;" />
      </div>

      <button id="pitem-submit-btn" type="submit" class="pitem-submit-btn">
        లిస్టింగ్‌ను సేవ్ చేయండి ➔
      </button>
    </form>
  </div>
</div>
