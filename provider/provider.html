<!-- provider/provider.html - 100% Dedicated Clean Provider Templates -->

<!-- 1. యజమాని ల్యాండింగ్ కార్డ్ టెంప్లేట్ (లాగిన్ కానప్పుడు పబ్లిక్ కార్డ్) -->
<template id="provider-landing-template">
  <div class="agri-landing-card provider-border">
    <div class="agri-card-header">
      <span class="agri-icon">🤝</span>
      <strong class="agri-title-provider">పరికరాలు, రవాణా & విత్తనాల యజమానుల సేవా కేంద్రం</strong>
    </div>
    <p class="agri-card-subtext">
      ట్రాక్టర్లు, హార్వెస్టర్లు, రవాణా వాహనాలు లేదా విత్తనాలు/ఎరువుల యజమానులు తమ సేవలను అద్దెకు/అమ్ముకానికి ఇక్కడ సులభంగా జోడించవచ్చు.
    </p>
    <ul class="agri-card-desc-list">
      <li>రైతుల నుండి నేరుగా బుకింగ్‌లు & ఆర్డర్‌లు పొందండి.</li>
      <li>మీ పరికరాలు, రవాణా రేట్లు మీరే నిర్ణయించుకోండి.</li>
      <li>కమిషన్ లేకుండా నేరుగా కస్టమర్‌తో ఫోన్ / వాట్సాప్ సంప్రదింపులు.</li>
    </ul>
    <button type="button" onclick="window.openProviderModal()" class="agri-landing-btn provider-btn-bg">
      యజమానిగా Login / సేవలను జోడించండి ➔
    </button>
  </div>
</template>

<!-- 2. యజమాని మెయిన్ డాష్‌బోర్డ్ షెల్ టెంప్లేట్ -->
<template id="provider-dashboard-template">
  <div class="provider-dashboard-card" id="provider-dash-card-box">
    <h3 class="provider-dash-title" id="p-dash-title">--</h3>
    <p class="provider-dash-desc" id="p-dash-desc">--</p>

    <!-- ⚡ అత్యవసర రైతు స్పాట్ అలర్ట్స్ కంటైనర్ (Tractor / Transport SOS) -->
    <div id="provider-spot-alerts-container" class="provider-spot-alerts-wrapper is-hidden"></div>

    <div onclick="window.openAddServiceModal()" class="provider-add-service-btn">
      <span class="provider-add-service-text">➕ కొత్త వస్తువును / సేవను జోడించండి</span>
      <p class="provider-add-service-subtext">వివరాలు నమోదు చేయడానికి ఇక్కడ నొక్కండి</p>
    </div>

    <div id="provider-items-list" class="provider-items-box-wrapper"></div>
    <div id="provider-incoming-requests" class="provider-incoming-requests-wrapper"></div>
  </div>
</template>

<!-- 3. ప్రొవైడర్ లాగిన్ & రిజిస్ట్రేషన్ మోడల్ -->
<template id="provider-auth-modal-template">
  <div id="provider-auth-modal" class="provider-modal-overlay">
    <div class="provider-modal-card">
      <button type="button" onclick="window.closeProviderModal()" class="provider-close-btn">✕</button>

      <div class="provider-modal-header">
        <h3 class="provider-modal-title">🤝 యజమానుల సేవా కేంద్రం</h3>
        <p class="provider-modal-subtitle">మీ కేటగిరీని ఎంచుకొని వివరాలు నమోదు చేయండి</p>
      </div>

      <div class="provider-tab-row">
        <button id="p-tab-equipment" type="button" onclick="window.selectProviderTab('equipment')" class="provider-tab-btn tab-eq active">
          🚜 పరికరాలు
        </button>
        <button id="p-tab-transport" type="button" onclick="window.selectProviderTab('transport')" class="provider-tab-btn tab-tr">
          🚚 రవాణా
        </button>
        <button id="p-tab-seeds" type="button" onclick="window.selectProviderTab('seeds')" class="provider-tab-btn tab-sd">
          🌱 విత్తనాలు
        </button>
      </div>

      <form id="provider-login-form" onsubmit="window.handleProviderLogin(event)">
        <div class="provider-form-group">
          <label class="provider-form-label">యజమాని / డీలర్ పేరు:</label>
          <input type="text" id="prov-name" placeholder="ఉదా: రామయ్య / బాలాజీ ఫెర్టిలైజర్స్" required class="provider-form-input" />
        </div>

        <div class="provider-form-group">
          <label class="provider-form-label">మొబైల్ నంబర్ (10 అంకెలు):</label>
          <input type="tel" id="prov-phone" pattern="[0-9]{10}" placeholder="10 అంకెల ఫోన్ నంబర్" required class="provider-form-input" />
        </div>

        <div class="provider-form-group last">
          <label class="provider-form-label">గ్రామం / పట్టణం:</label>
          <input type="text" id="prov-village" placeholder="ఉదా: పరకాల, వరంగల్" required class="provider-form-input" />
        </div>

        <button id="prov-submit-btn" type="submit" class="provider-submit-btn">
          🚜 పరికరాల ఓనర్‌గా డాష్‌బోర్డ్‌కు వెళ్లండి ➔
        </button>
      </form>
    </div>
  </div>
</template>

<!-- 4. కొత్త వస్తువు / సేవను జోడించే పాప్-అప్ మోడల్ -->
<template id="provider-item-modal-template">
  <div id="provider-item-modal" class="pitem-modal-overlay">
    <div class="pitem-modal-card">
      <button type="button" onclick="window.closeAddServiceModal()" class="provider-close-btn">✕</button>
      <h3 id="pitem-modal-title" class="pitem-modal-title">--</h3>

      <form id="pitem-form" onsubmit="window.handleSaveProviderItem(event)">
        <div id="pitem-dynamic-fields"></div>
        <button type="submit" class="pitem-submit-btn">లిస్టింగ్‌ను సేవ్ చేయండి ➔</button>
      </form>
    </div>
  </div>
</template>

<!-- 5. ⚡ అత్యవసర స్పాట్ అభ్యర్థన కార్డ్ టెంప్లేట్ (Farmer SOS ➔ Provider) -->
<template id="provider-spot-card-template">
  <div class="provider-spot-card">
    <div class="provider-spot-card-top">
      <div>
        <span class="badge-sos-blink">🚨 తక్షణ అత్యవసర ఆర్డర్ (SOS)</span>
        <h4 class="provider-spot-title"></h4>
        <div class="provider-spot-farmer"></div>
        <div class="provider-spot-req"></div>
      </div>
      <div class="provider-spot-wage"></div>
    </div>
    <div class="provider-spot-actions">
      <button type="button" class="btn-spot-accept-provider">✅ ఆర్డర్ ఒప్పుకోండి (Accept)</button>
    </div>
  </div>
</template>

<!-- 6. యజమాని జోడించిన వస్తువుల బాక్స్ షెల్ టెంప్లేట్ -->
<template id="provider-items-box-template">
  <div class="pitem-box">
    <div class="pitem-header">
      <div class="pitem-title-text">మీరు జోడించినవి <span class="pitem-count-badge" id="pitem-badge-count">0</span></div>
    </div>
    <div class="pitem-scroll-list" id="pitem-scroll-target"></div>
  </div>
</template>

<!-- 7. సింగిల్ ప్రొవైడర్ ఐటమ్ రో టెంప్లేట్ -->
<template id="provider-item-row-template">
  <div class="pitem-card-row">
    <div>
      <div class="pitem-card-title"></div>
      <div class="pitem-card-details">
        ధర: <b class="pitem-price-text"></b> | <span class="pitem-status-text"></span>
      </div>
    </div>
    <button type="button" class="pitem-delete-btn">తీసివేయి</button>
  </div>
</template>

<!-- 8. ఇన్‌కమింగ్ ఆర్డర్స్ బాక్స్ షెల్ టెంప్లేట్ -->
<template id="provider-orders-box-template">
  <div class="porders-box">
    <div class="porders-header">
      <div class="porders-title">🔔 రైతుల నుండి వచ్చిన రిక్వెస్ట్‌లు <span class="porders-count-badge" id="porders-badge-count">0</span></div>
    </div>
    <div class="porders-scroll-list" id="porders-scroll-target"></div>
  </div>
</template>

<!-- 9. సింగిల్ ఇన్‌కమింగ్ ఆర్డర్ కార్డ్ టెంప్లేట్ -->
<template id="provider-order-card-template">
  <div class="porders-card">
    <div class="porders-card-top">
      <span class="porders-type-tag"></span>
      <span class="porders-time-text"></span>
    </div>
    <div class="porders-veh-name"></div>
    <div class="porders-work-details"></div>
    <div class="porders-btn-row">
      <a class="porders-action-btn porders-call-btn">📞 కాల్</a>
      <button type="button" class="porders-action-btn porders-accept-btn">✅ ఒప్పుకోండి</button>
      <span class="porders-accepted-badge is-hidden">✅ కన్ఫర్మ్ అయింది</span>
    </div>
  </div>
</template>

<!-- 10. రైతు ట్యాబ్‌ల కోసం ప్రొవైడర్ ఐటమ్ కార్డ్ టెంప్లేట్ (Farmer Dashboard Cards) -->
<template id="farmer-category-item-template">
  <div class="farmer-market-card">
    <div class="farmer-market-card-top">
      <div>
        <h4 class="market-item-name"></h4>
        <div class="market-item-owner"></div>
        <div class="market-item-meta"></div>
      </div>
      <div class="market-item-rate"></div>
    </div>
    <div class="farmer-market-actions">
      <a class="market-btn-call">📞 కాల్</a>
      <a target="_blank" class="market-btn-wa">💬 వాట్సాప్</a>
      <button type="button" class="market-btn-book">📋 బుక్ చేయండి</button>
    </div>
  </div>
</template>
