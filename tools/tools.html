<!-- 8-GRID SMART AGRI TOOLS COMPONENT -->
<section class="agri-tools-wrapper">
  <div class="agri-tools-header">
 <h3>🛠️ రైతు SMART సేవలు & Power Tools</h3>
    <span class="agri-badge-free">● LIVE</span>
  </div>

  <div class="agri-tools-grid" id="agriToolsGrid">
    <!-- 1. మార్కెట్ ధరలు Slot -->
    <div id="slot-tool-market"></div>

    <!-- 2. పొలం కొలత Slot -->
    <div id="slot-tool-measure"></div>

    <!-- 3. రైతు క్యాలెండర్ Slot -->
    <div id="slot-tool-calendar"></div>

    <!-- 4. ఎరువులు & విత్తనాలు Slot -->
    <div id="slot-tool-fertilizer"></div>

    <!-- 5. పంట తెగుళ్లు Slot -->
    <div id="slot-tool-pest"></div>

    <!-- 6. ఖర్చులు & కూలీల డైరీ Slot -->
    <div id="slot-tool-diary"></div>

    <!-- 7. క్రాప్ డాక్టర్ Slot -->
    <div id="slot-tool-crop-doctor"></div>

    <!-- 8. ప్రభుత్వ పథకాలు Slot -->
    <div id="slot-tool-schemes"></div>
  </div>
</section>

<!-- UNIVERSAL POPUP CONTAINER -->
<div id="agriToolModal" class="agri-modal-overlay" onclick="hideToolModal(event)">
  <div class="agri-modal-container" onclick="event.stopPropagation()">
    <div class="agri-modal-header">
      <h4 id="agriModalHeaderTitle">టూల్ వివరాలు</h4>
      <button class="agri-modal-close" onclick="hideToolModal(null)">✕</button>
    </div>

    <div class="agri-modal-body" id="agriModalBody">
      <div id="view-market" class="tool-view-panel"></div>
      <div id="view-measure" class="tool-view-panel"></div>
      <div id="view-calendar" class="tool-view-panel"></div>
      <div id="view-fertilizer" class="tool-view-panel"></div>
      <div id="view-pest" class="tool-view-panel"></div>
      <div id="view-diary" class="tool-view-panel"></div>
      <div id="view-crop_doctor" class="tool-view-panel"></div>
      <div id="view-schemes" class="tool-view-panel"></div>
    </div>
  </div>
</div>
