name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Live Data with Python
        run: |
          python -c "
          import requests, json

          # Pure Govt Agmarknet Endpoint
          url = 'https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070'
          params = {
              'api-key': '579b464db66ecb3875b39ed9319231f2',
              'format': 'json',
              'limit': '300'
          }
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
          }

          res = requests.get(url, params=params, headers=headers, timeout=30)
          print(f'Server Status: {res.status_code}')

          data = res.json()
          records = data.get('records', [])
          print(f'Total live records received: {len(records)}')

          if len(records) > 0:
              with open('mandi_live.json', 'w', encoding='utf-8') as f:
                  json.dump(records, f, ensure_ascii=False, indent=2)
              print('mandi_live.json successfully updated with live Govt data.')
          else:
              print('Govt API returned empty records list.')
              exit(1)
          "

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Live Mandi Sync [skip ci]" || echo "No changes"
          git push
