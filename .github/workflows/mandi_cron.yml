name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Live Agmarknet Records
        run: |
          python -c "
          import requests, json

          # Government Agmarknet Daily Live Commodities Feed
          api_url = 'https://api.data.gov.in/resource/35985678-0d79-46b4-9ed6-6f13308a1d24?api-key=579b464db66ecb3875b39ed9319231f2&format=json&limit=500'
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
          }

          records = []
          try:
              res = requests.get(api_url, headers=headers, timeout=30)
              if res.status_code == 200:
                  data = res.json()
                  records = data.get('records', [])
          except Exception as e:
              print(f'Primary API error: {e}')

          # Fallback: Open APMC Daily Feed
          if not records:
              alt_url = 'https://raw.githubusercontent.com/CivicDataLab/agmarknet-data/main/data/latest.json'
              try:
                  res2 = requests.get(alt_url, headers=headers, timeout=30)
                  if res2.status_code == 200:
                      data2 = res2.json()
                      records = data2 if isinstance(data2, list) else data2.get('records', [])
              except Exception as e:
                  print(f'Alt feed error: {e}')

          if len(records) > 0:
              with open('mandi_live.json', 'w', encoding='utf-8') as f:
                  json.dump(records, f, ensure_ascii=False, indent=2)
              print(f'Successfully fetched and saved {len(records)} live records!')
          else:
              print('Unable to fetch live records from providers.')
              exit(1)
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Auto-sync real Mandi rates [skip ci]" || echo "No changes"
          git push
