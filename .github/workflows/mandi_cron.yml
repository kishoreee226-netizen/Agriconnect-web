name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Fetch Real Dynamic Mandi Rates
        run: |
          python -c "
          import requests
          import json
          import csv
          import io
          import os
          import sys
          import urllib3

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': '*/*'
          }

          records = []

          # 1. Live Multi-state Agmarknet Data Feed (Pure Dynamic Government Records)
          target_urls = [
              'https://raw.githubusercontent.com/CivicDataLab/agmarknet-data/main/data/sample_latest.json',
              'https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ecb3875b39ed9319231f2&format=csv&limit=500'
          ]

          for url in target_urls:
              try:
                  print(f'Fetching from dynamic source: {url[:60]}...')
                  res = requests.get(url, headers=headers, timeout=25, verify=False)
                  if res.status_code == 200 and len(res.text) > 100:
                      if url.endswith('.json'):
                          items = res.json()
                          raw_list = items if isinstance(items, list) else items.get('records', [])
                          for it in raw_list:
                              st = (it.get('state') or it.get('State') or '').strip()
                              mkt = (it.get('market') or it.get('Market') or '').strip()
                              comm = (it.get('commodity') or it.get('Commodity') or '').strip()
                              price = str(it.get('modal_price') or it.get('Modal_Price') or it.get('price') or '0').strip()

                              if st and comm and 'national' not in mkt.lower() and 'all india' not in st.lower():
                                  records.append({
                                      'state': st,
                                      'district': (it.get('district') or it.get('District') or '').strip(),
                                      'market': mkt,
                                      'commodity': comm,
                                      'modal_price': price
                                  })
                      else:
                          csv_reader = csv.DictReader(io.StringIO(res.text))
                          for row in csv_reader:
                              st = (row.get('state') or row.get('State') or '').strip()
                              mkt = (row.get('market') or row.get('Market') or '').strip()
                              comm = (row.get('commodity') or row.get('Commodity') or '').strip()
                              price = str(row.get('modal_price') or row.get('Modal_Price') or '0').strip()

                              if st and comm and 'national' not in mkt.lower() and 'all india' not in st.lower():
                                  records.append({
                                      'state': st,
                                      'district': (row.get('district') or row.get('District') or '').strip(),
                                      'market': mkt,
                                      'commodity': comm,
                                      'modal_price': price
                                  })

                      if len(records) > 0:
                          print(f'SUCCESS: Loaded {len(records)} authentic APMC records.')
                          break
              except Exception as err:
                  print(f'Source fetch error: {err}')

          if len(records) == 0:
              print('CRITICAL: Pure dynamic data not reachable right now.')
              sys.exit(1)

          file_path = os.path.join(os.getcwd(), 'mandi_live.json')
          with open(file_path, 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          print(f'Successfully updated {len(records)} dynamic records into {file_path}')
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git status
          git commit -m "Auto-sync live dynamic APMC rates [skip ci]" || echo "No changes"
          git push origin main
