name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Real State-wise Mandi Data
        run: |
          python -c "
          import requests
          import json

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
          }

          # Real-time Multi-State APMC Mandi Data Endpoints
          endpoints = [
              'https://mandi-api.vercel.app/api/prices',
              'https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ecb3875b39ed9319231f2&format=json&limit=1000'
          ]

          records = []

          for url in endpoints:
              try:
                  res = requests.get(url, headers=headers, timeout=20)
                  if res.status_code == 200:
                      data = res.json()
                      items = data if isinstance(data, list) else data.get('records', [])
                      if len(items) > 0:
                          for r in items:
                              records.append({
                                  'state': r.get('state') or r.get('State') or 'Telangana',
                                  'district': r.get('district') or r.get('District') or '',
                                  'market': r.get('market') or r.get('Market') or r.get('mandi', 'APMC'),
                                  'commodity': r.get('commodity') or r.get('Commodity') or r.get('crop', ''),
                                  'modal_price': r.get('modal_price') or r.get('Modal_Price') or r.get('price', '0')
                              })
                          print(f'Successfully pulled {len(records)} real mandi records.')
                          break
              except Exception as e:
                  print(f'Error with {url}: {e}')

          if len(records) > 0:
              with open('mandi_live.json', 'w', encoding='utf-8') as f:
                  json.dump(records, f, ensure_ascii=False, indent=2)
              print('mandi_live.json successfully written with real data.')
          else:
              print('Could not pull from live feeds.')
              exit(1)
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Auto-sync real Mandi rates [skip ci]" || echo "No changes"
          git push
