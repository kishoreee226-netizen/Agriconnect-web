name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Real Daily Agmarknet Feed
        run: |
          python -c "
          import requests
          import json

          # Live Daily Open Mandi Aggregator Feed (Auto-updated daily)
          feed_url = 'https://raw.githubusercontent.com/the-prafful/agmarknet-live-data/main/latest_mandi_prices.json'

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
          }

          res = requests.get(feed_url, headers=headers, timeout=30)
          
          if res.status_code == 200:
              items = res.json()
              records = items if isinstance(items, list) else items.get('records', [])
              
              clean_records = []
              for r in records:
                  st = r.get('state') or r.get('State') or ''
                  # ఆల్ ఇండియా లేదా నేషనల్ కాకుండా నిజమైన రాష్ట్ర రికార్డులు మాత్రమే
                  if st and not 'all india' in st.lower() and not 'national' in st.lower():
                      clean_records.append({
                          'state': st,
                          'district': r.get('district') or r.get('District') or '',
                          'market': r.get('market') or r.get('Market') or '',
                          'commodity': r.get('commodity') or r.get('Commodity') or '',
                          'modal_price': r.get('modal_price') or r.get('Modal_Price') or '0'
                      })

              if len(clean_records) > 0:
                  with open('mandi_live.json', 'w', encoding='utf-8') as f:
                      json.dump(clean_records, f, ensure_ascii=False, indent=2)
                  print(f'Done! Successfully updated mandi_live.json with {len(clean_records)} live government records.')
              else:
                  print('No valid state records found in feed.')
                  exit(1)
          else:
              print(f'Failed to fetch feed: HTTP {res.status_code}')
              exit(1)
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Auto-sync real Mandi rates [skip ci]" || echo "No changes"
          git push
