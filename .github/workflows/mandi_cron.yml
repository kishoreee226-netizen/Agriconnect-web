name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests urllib3 cloudscraper

      - name: Fetch Live Data via Dynamic Gov Tunnel
        run: |
          python -c "
          import requests
          import json
          import os
          import sys
          import cloudscraper

          scraper = cloudscraper.create_scraper(
              browser={'browser': 'chrome', 'platform': 'windows', 'mobile': False}
          )

          api_key = '579b464db66ecb3875b39ed9319231f2'
          resource_id = '9ef84268-d588-465a-a308-a864a43d0070'
          gov_url = f'https://api.data.gov.in/resource/{resource_id}?api-key={api_key}&format=json&limit=1500'

          # Direct & Proxy Gateways
          endpoints = [
              f'https://proxy.cors.sh/{gov_url}',
              f'https://api.allorigins.win/raw?url={requests.utils.quote(gov_url)}',
              gov_url
          ]

          records = []

          for ep in endpoints:
              try:
                  print(f'Connecting to: {ep[:60]}...')
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
                      'x-cors-grida-api-key': 'free'
                  }
                  res = scraper.get(ep, headers=headers, timeout=25)
                  if res.status_code == 200 and len(res.text) > 100:
                      payload = res.json()
                      items = payload.get('records', []) if isinstance(payload, dict) else (payload if isinstance(payload, list) else [])
                      
                      for it in items:
                          st = (it.get('state') or it.get('State') or '').strip()
                          mkt = (it.get('market') or it.get('Market') or '').strip()
                          comm = (it.get('commodity') or it.get('Commodity') or '').strip()
                          pr = str(it.get('modal_price') or it.get('Modal_Price') or it.get('price') or '0').strip()

                          if st and comm and 'national' not in mkt.lower() and 'all india' not in st.lower():
                              records.append({
                                  'state': st,
                                  'district': (it.get('district') or it.get('District') or '').strip(),
                                  'market': mkt,
                                  'commodity': comm,
                                  'modal_price': pr
                              })
                      
                      if len(records) > 0:
                          print(f'SUCCESS: Retrieved {len(records)} authentic APMC records.')
                          break
              except Exception as e:
                  print(f'Route notice: {e}')

          target_file = os.path.join(os.getcwd(), 'mandi_live.json')

          # If live stream was successful, write fresh records
          if len(records) > 0:
              with open(target_file, 'w', encoding='utf-8') as f:
                  json.dump(records, f, ensure_ascii=False, indent=2)
              print(f'Updated {target_file} with {len(records)} live entries.')
          else:
              print('Warning: Live stream could not be reached this run. Checking existing file.')
              if not os.path.exists(target_file) or os.path.getsize(target_file) < 50:
                  print('Error: mandi_live.json is empty.')
                  sys.exit(1)
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git status
          git commit -m "Auto-sync real live Mandi rates [skip ci]" || echo "No changes"
          git push origin main || echo "Nothing to push"
