name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Live Agmarknet Portal Data
        run: |
          python -c "
          import requests
          from bs4 import BeautifulSoup
          import json
          import re

          url = 'https://agmarknet.gov.in/SearchCddb.aspx?Tx_Commodity=0&Tx_State=0&Tx_District=0&Tx_Market=0&DateFrom=&DateTo=&Fr_Date=&To_Date=&Tx_Trend=0&Tx_CommodityHead=&Tx_StateHead=&Tx_DistrictHead=&Tx_MarketHead='
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          }

          records = []
          try:
              res = requests.get(url, headers=headers, timeout=30)
              if res.status_code == 200:
                  soup = BeautifulSoup(res.text, 'html.parser')
                  table = soup.find('table', {'id': re.compile(r'.*cgridGovData.*|.*gridCommodity.*')}) or soup.find('table', {'class': 'table'})
                  
                  if table:
                      rows = table.find_all('tr')
                      for tr in rows[1:]:
                          cols = [td.get_text(strip=True) for td in tr.find_all('td')]
                          if len(cols) >= 6:
                              records.append({
                                  'state': cols[0],
                                  'district': cols[1],
                                  'market': cols[2],
                                  'commodity': cols[3],
                                  'modal_price': cols[5]
                              })
          except Exception as e:
              print(f'Agmarknet direct pull note: {e}')

          # Direct fallback from open daily agricultural archive
          if not records:
              feed = 'https://raw.githubusercontent.com/datameet/agmarknet-data/master/data/latest.json'
              try:
                  r = requests.get(feed, headers=headers, timeout=25)
                  if r.status_code == 200:
                      data = r.json()
                      records = data if isinstance(data, list) else data.get('records', [])
              except Exception as e:
                  print(f'Archive note: {e}')

          if len(records) > 0:
              with open('mandi_live.json', 'w', encoding='utf-8') as f:
                  json.dump(records, f, ensure_ascii=False, indent=2)
              print(f'Success! Updated mandi_live.json with {len(records)} live records.')
          else:
              print('No records found.')
              exit(1)
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Auto-sync real Mandi rates [skip ci]" || echo "No changes"
          git push
