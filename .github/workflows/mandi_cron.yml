name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Stream Real Agmarknet Market Bulletin
        run: |
          python -c "
          import requests
          import json
          import os
          import sys
          import urllib3

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': '*/*'
          }

          records = []

          # Public-facing Agmarknet state-wise daily commodity bulletin mirrors
          feed_urls = [
              'https://api.github.com/repos/theprafful/agmarknet-live-data/git/blobs/master',
              'https://raw.githubusercontent.com/sivakar/agmarknet-data/master/latest.json'
          ]

          # Try mirror first
          for f_url in feed_urls:
              try:
                  print(f'Attempting bulletin: {f_url[:60]}...')
                  r = requests.get(f_url, headers=headers, timeout=20)
                  if r.status_code == 200:
                      data = r.json()
                      items = data if isinstance(data, list) else data.get('records', [])
                      for it in items:
                          st = (it.get('state') or it.get('State') or '').strip()
                          mkt = (it.get('market') or it.get('Market') or '').strip()
                          comm = (it.get('commodity') or it.get('Commodity') or '').strip()
                          pr = str(it.get('modal_price') or it.get('Modal_Price') or it.get('price') or '0').strip()
                          if st and comm and 'national' not in mkt.lower() and 'all india' not in st.lower():
                              records.append({
                                  'state': st,
                                  'district': (it.get('district') or it.get('District') or '').strip(),
                                  'market': mkt,
                                  'commodity': comm,
                                  'modal_price': pr
                              })
                      if len(records) > 0:
                          break
              except Exception as e:
                  print(f'Bulletin notice: {e}')

          # Secondary: Query Open Agmarknet Daily State Aggregates
          if len(records) == 0:
              try:
                  url = 'https://raw.githubusercontent.com/theprafful/agmarknet-live-data/5a91bc171d1e4c738096f2e825a2503ea2974b65/latest_mandi_prices.json'
                  res = requests.get(url, headers=headers, timeout=20)
                  if res.status_code == 200:
                      for item in res.json():
                          st = (item.get('state') or item.get('State') or '').strip()
                          mkt = (item.get('market') or item.get('Market') or '').strip()
                          comm = (item.get('commodity') or item.get('Commodity') or '').strip()
                          pr = str(item.get('modal_price') or item.get('Modal_Price') or item.get('price') or '0').strip()
                          if st and comm and 'national' not in mkt.lower() and 'all india' not in st.lower():
                              records.append({
                                  'state': st,
                                  'district': (item.get('district') or item.get('District') or '').strip(),
                                  'market': mkt,
                                  'commodity': comm,
                                  'modal_price': pr
                              })
              except Exception as e:
                  print(f'Direct raw notice: {e}')

          if len(records) == 0:
              print('CRITICAL: Feed unreachable.')
              sys.exit(1)

          file_path = os.path.join(os.getcwd(), 'mandi_live.json')
          with open(file_path, 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          print(f'SUCCESS: Synced {len(records)} authentic APMC records into {file_path}')
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git status
          git commit -m "Auto-sync live APMC rates [skip ci]" || echo "No changes"
          git push origin main
