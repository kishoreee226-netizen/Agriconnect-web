name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Live Daily Agmarknet Records
        run: |
          python -c "
          import requests, json

          # Active Daily Agmarknet Open Data Feed (Telangana & All States)
          feed_url = 'https://raw.githubusercontent.com/datameet/agmarknet-data/master/sample_latest.json'
          
          try:
              res = requests.get(feed_url, timeout=25)
              if res.status_code == 200:
                  data = res.json()
                  records = data if isinstance(data, list) else data.get('records', [])
                  if len(records) > 0:
                      with open('mandi_live.json', 'w', encoding='utf-8') as f:
                          json.dump(records, f, ensure_ascii=False, indent=2)
                      print(f'Success! Updated mandi_live.json with {len(records)} live records.')
                  else:
                      print('Records list empty.')
                      exit(1)
              else:
                  print(f'Server status: {res.status_code}')
                  exit(1)
          except Exception as e:
              print(f'Error fetching feed: {e}')
              exit(1)
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Auto-sync real Mandi rates [skip ci]" || echo "No changes"
          git push
          
