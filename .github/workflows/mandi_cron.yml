name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch 100% Real Live Agmarknet Data via IPv4
        run: |
          # 1. Force IPv4 connection directly to data.gov.in to bypass IPv6 connection refusal
          curl -4 -s -S --connect-timeout 20 --retry 3 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/json" \
            "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ecb3875b39ed9319231f2&format=json&limit=1500" \
            -o raw_mandi.json

          # 2. Parse, filter and write cleanly to mandi_live.json
          python -c "
          import json
          import os
          import sys

          if not os.path.exists('raw_mandi.json') or os.path.getsize('raw_mandi.json') < 100:
              print('CRITICAL: Empty response from government portal.')
              sys.exit(1)

          with open('raw_mandi.json', 'r', encoding='utf-8') as f:
              try:
                  data = json.load(f)
              except Exception as err:
                  print(f'JSON decode error: {err}')
                  sys.exit(1)

          items = data.get('records', []) if isinstance(data, dict) else []
          records = []

          for it in items:
              st = (it.get('state') or it.get('State') or '').strip()
              mkt = (it.get('market') or it.get('Market') or '').strip()
              comm = (it.get('commodity') or it.get('Commodity') or '').strip()
              pr = str(it.get('modal_price') or it.get('Modal_Price') or it.get('price') or '0').strip()

              if st and comm and 'national' not in mkt.lower() and 'all india' not in st.lower():
                  records.append({
                      'state': st,
                      'district': (it.get('district') or it.get('District') or '').strip(),
                      'market': mkt,
                      'commodity': comm,
                      'modal_price': pr
                  })

          if len(records) == 0:
              print('CRITICAL: No valid APMC records found in response.')
              sys.exit(1)

          with open('mandi_live.json', 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          print(f'SUCCESS: Saved {len(records)} authentic APMC records into mandi_live.json')
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git status
          git commit -m "Auto-sync real live Mandi rates [skip ci]" || echo "No changes"
          git push origin main
