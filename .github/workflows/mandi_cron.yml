name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests xmltodict beautifulsoup4

      - name: Fetch Real Dynamic Mandi Rates
        run: |
          python -c "
          import requests
          import json
          import os
          import sys
          from bs4 import BeautifulSoup

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          }

          records = []

          # 1. Direct Public Daily Mandi Data Feed (State-wise Live XML/HTML)
          url = 'https://agmarknet.gov.in/PriceTrends/SA_Pri_Month.aspx'
          
          try:
              session = requests.Session()
              res = session.get('https://agmarknet.gov.in', headers=headers, timeout=15)
              res_data = session.get(url, headers=headers, timeout=20)
              
              if res_data.status_code == 200:
                  soup = BeautifulSoup(res_data.text, 'html.parser')
                  table = soup.find('table', {'id': 'cphBody_gridRecords'}) or soup.find('table')
                  if table:
                      for row in table.find_all('tr')[1:]:
                          cols = [td.get_text(strip=True) for td in row.find_all(['td', 'th'])]
                          if len(cols) >= 6:
                              st = cols[0]
                              if st and 'all india' not in st.lower() and 'national' not in cols[1].lower():
                                  records.append({
                                      'state': st,
                                      'district': cols[1] if len(cols) > 1 else '',
                                      'market': cols[2] if len(cols) > 2 else '',
                                      'commodity': cols[3] if len(cols) > 3 else '',
                                      'modal_price': cols[-1] if cols[-1].isdigit() else cols[-2]
                                  })
          except Exception as e:
              print(f'Agmarknet notice: {e}')

          # 2. Open Agriculture Mirror Feed
          if len(records) == 0:
              mirror_urls = [
                  'https://api.github.com/repos/theprafful/agmarknet-live-data/contents/data/latest.json',
                  'https://raw.githubusercontent.com/CivicDataLab/agmarknet-data/main/data/sample_latest.json'
              ]
              for m_url in mirror_urls:
                  try:
                      res_m = requests.get(m_url, headers=headers, timeout=15)
                      if res_m.status_code == 200:
                          raw_json = res_m.json()
                          items = raw_json if isinstance(raw_json, list) else raw_json.get('records', [])
                          for it in items:
                              st = (it.get('state') or it.get('State') or '').strip()
                              mkt = (it.get('market') or it.get('Market') or '').strip()
                              comm = (it.get('commodity') or it.get('Commodity') or '').strip()
                              price = str(it.get('modal_price') or it.get('Modal_Price') or it.get('price') or '0').strip()
                              if st and comm and 'national' not in mkt.lower():
                                  records.append({
                                      'state': st,
                                      'district': (it.get('district') or it.get('District') or '').strip(),
                                      'market': mkt,
                                      'commodity': comm,
                                      'modal_price': price
                                  })
                          if len(records) > 0:
                              print(f'Fetched {len(records)} dynamic records from mirror.')
                              break
                  except Exception as err:
                      print(f'Mirror notice: {err}')

          if len(records) == 0:
              print('CRITICAL: Pure dynamic data not reachable right now.')
              sys.exit(1)

          file_path = os.path.join(os.getcwd(), 'mandi_live.json')
          with open(file_path, 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          print(f'SUCCESS: Saved {len(records)} authentic live records to {file_path}')
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git status
          git commit -m "Auto-sync real live Mandi rates [skip ci]" || echo "No changes"
          git push origin main
