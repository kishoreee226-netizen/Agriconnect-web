name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Fetch Real Dynamic Mandi Rates
        run: |
          python -c "
          import requests
          import json
          import os
          import sys
          import urllib3

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': 'application/json'
          }

          records = []

          # Direct public-access data.gov.in Agmarknet mirrors that don't block GitHub Actions
          sources = [
              'https://raw.githubusercontent.com/datameet/agmarknet/master/data/latest/all_india_mandi.json',
              'https://cdn.jsdelivr.net/gh/datameet/agmarknet@master/data/latest/all_india_mandi.json',
              'https://api.allorigins.win/raw?url=' + requests.utils.quote('https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ecb3875b39ed9319231f2&format=json&limit=1000')
          ]

          for src in sources:
              try:
                  print(f'Fetching live data feed: {src[:65]}...')
                  res = requests.get(src, headers=headers, timeout=20)
                  if res.status_code == 200 and len(res.text) > 100:
                      payload = res.json()
                      items = payload if isinstance(payload, list) else (payload.get('records') or payload.get('data') or [])
                      for it in items:
                          state = (it.get('state') or it.get('State') or it.get('state_name') or '').strip()
                          market = (it.get('market') or it.get('Market') or it.get('apmc_name') or '').strip()
                          commodity = (it.get('commodity') or it.get('Commodity') or it.get('commodity_name') or '').strip()
                          price = str(it.get('modal_price') or it.get('Modal_Price') or it.get('price') or '0').strip()

                          if state and commodity and 'national' not in market.lower() and 'all india' not in state.lower():
                              records.append({
                                  'state': state,
                                  'district': (it.get('district') or it.get('District') or it.get('district_name') or '').strip(),
                                  'market': market,
                                  'commodity': commodity,
                                  'modal_price': price
                              })
                      if len(records) > 0:
                          print(f'SUCCESS: Synced {len(records)} authentic APMC records.')
                          break
              except Exception as err:
                  print(f'Notice: {err}')

          if len(records) == 0:
              print('CRITICAL: Dynamic data stream unreachable.')
              sys.exit(1)

          file_path = os.path.join(os.getcwd(), 'mandi_live.json')
          with open(file_path, 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          print(f'Successfully wrote {len(records)} records to {file_path}')
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git status
          git commit -m "Auto-sync real live Mandi rates [skip ci]" || echo "No changes"
          git push origin main
