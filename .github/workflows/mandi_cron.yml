name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 100% Real Live Agmarknet Mandi Data
        run: |
          python -c "
          import requests
          import json
          import os
          import sys

          # Official data.gov.in Agmarknet Real-time Daily Price Resource
          api_key = '579b464db66ecb3875b39ed9319231f2'
          resource_id = '9ef84268-d588-465a-a308-a864a43d0070'
          
          # Target multiple proxy mirrors to bypass foreign cloud IP geo-restrictions
          raw_gov_url = f'https://api.data.gov.in/resource/{resource_id}?api-key={api_key}&format=json&limit=2500'
          
          endpoints = [
              f'https://corsproxy.io/?{requests.utils.quote(raw_gov_url)}',
              f'https://api.allorigins.win/raw?url={requests.utils.quote(raw_gov_url)}',
              raw_gov_url
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': 'application/json'
          }

          records = []

          for url in endpoints:
              try:
                  print(f'Fetching from live gateway: {url[:50]}...')
                  res = requests.get(url, headers=headers, timeout=30)
                  if res.status_code == 200:
                      payload = res.json()
                      items = payload.get('records', []) if isinstance(payload, dict) else payload
                      
                      if items and len(items) > 0:
                          for it in items:
                              state = (it.get('state') or it.get('State') or '').strip()
                              market = (it.get('market') or it.get('Market') or '').strip()
                              commodity = (it.get('commodity') or it.get('Commodity') or '').strip()
                              price = str(it.get('modal_price') or it.get('Modal_Price') or it.get('price') or '0').strip()

                              # Strictly filter out 'National' or 'All India' aggregates to ensure state/APMC level fidelity
                              if state and commodity and 'national' not in market.lower() and 'all india' not in state.lower():
                                  records.append({
                                      'state': state,
                                      'district': (it.get('district') or it.get('District') or '').strip(),
                                      'market': market,
                                      'commodity': commodity,
                                      'modal_price': price
                                  })
                          
                          if len(records) > 0:
                              print(f'SUCCESS: Retrieved {len(records)} authentic APMC records directly from government feed.')
                              break
              except Exception as err:
                  print(f'Gateway error: {err}')

          if len(records) == 0:
              print('CRITICAL: No dynamic records could be fetched from live endpoints.')
              sys.exit(1)

          target_path = os.path.join(os.getcwd(), 'mandi_live.json')
          with open(target_path, 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          print(f'Successfully wrote {len(records)} live records to {target_path}')
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git status
          git commit -m "Automated sync: latest live Agmarknet records [skip ci]" || echo "No new records to push"
          git push origin main
