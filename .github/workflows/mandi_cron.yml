name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Real Dynamic Mandi Rates
        run: |
          python -c "
          import requests
          import json
          import os
          import sys

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          }

          records = []

          # Active Multi-State Agricultural Mandi Records Stream
          urls = [
              'https://raw.githubusercontent.com/CivicDataLab/agmarknet-data/main/data/sample_latest.json',
              'https://raw.githubusercontent.com/theprafful/agmarknet-live-data/master/data/latest.json'
          ]

          for u in urls:
              try:
                  print(f'Connecting to data stream: {u}')
                  r = requests.get(u, headers=headers, timeout=20)
                  if r.status_code == 200:
                      raw_data = r.json()
                      items = raw_data if isinstance(raw_data, list) else (raw_data.get('records') or [])
                      for item in items:
                          st = (item.get('state') or item.get('State') or '').strip()
                          mkt = (item.get('market') or item.get('Market') or '').strip()
                          comm = (item.get('commodity') or item.get('Commodity') or '').strip()
                          price = str(item.get('modal_price') or item.get('Modal_Price') or item.get('price') or '0').strip()

                          if st and comm and 'national' not in mkt.lower() and 'all india' not in st.lower():
                              records.append({
                                  'state': st,
                                  'district': (item.get('district') or item.get('District') or '').strip(),
                                  'market': mkt,
                                  'commodity': comm,
                                  'modal_price': price
                              })
                      if len(records) > 0:
                          print(f'SUCCESS: Retrieved {len(records)} authentic APMC records.')
                          break
              except Exception as err:
                  print(f'Notice: {err}')

          if len(records) == 0:
              print('CRITICAL: No dynamic records retrieved.')
              sys.exit(1)

          file_path = os.path.join(os.getcwd(), 'mandi_live.json')
          with open(file_path, 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          print(f'Saved {len(records)} dynamic records into {file_path}')
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git status
          git commit -m "Auto-sync real live Mandi rates [skip ci]" || echo "No changes"
          git push origin main
