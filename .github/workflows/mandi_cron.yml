name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Real Multi-State Mandi Data
        run: |
          python -c "
          import requests
          import json

          # Official eNAM Real-Time Market Trade Dashboard API
          url = 'https://enam.gov.in/web/Ajax_ctrl/trade_data_list'
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
              'X-Requested-With': 'XMLHttpRequest',
              'Referer': 'https://enam.gov.in/web/dashboard/trade-data'
          }

          payload = {
              'language': 'en',
              'state_name': '-- All --',
              'apmc_name': '-- All --',
              'commodity_name': '-- All --'
          }

          records = []
          try:
              res = requests.post(url, headers=headers, data=payload, timeout=30)
              if res.status_code == 200:
                  json_data = res.json()
                  raw_list = json_data.get('data', [])
                  for item in raw_list:
                      state = item.get('state_name', '').strip()
                      market = item.get('apmc_name', '').strip()
                      commodity = item.get('commodity_name', '').strip()
                      price = item.get('modal_price') or item.get('max_price') or '0'
                      
                      if state and commodity:
                          records.append({
                              'state': state,
                              'district': item.get('district_name', '').strip(),
                              'market': market,
                              'commodity': commodity,
                              'modal_price': str(price)
                          })
                  print(f'Retrieved {len(records)} authentic records directly from e-NAM.')
              else:
                  print(f'eNAM status code: {res.status_code}')
          except Exception as e:
              print(f'eNAM request error: {e}')

          if len(records) > 0:
              with open('mandi_live.json', 'w', encoding='utf-8') as f:
                  json.dump(records, f, ensure_ascii=False, indent=2)
              print(f'SUCCESS: mandi_live.json updated with {len(records)} real state/market records.')
          else:
              print('Failed to pull live records.')
              exit(1)
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Auto-sync live multi-state Mandi rates [skip ci]" || echo "No changes"
          git push
