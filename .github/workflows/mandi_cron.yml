name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Pure Dynamic Mandi Data
        run: |
          python -c "
          import requests
          import json
          import csv
          import io
          import os
          import sys

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': '*/*'
          }

          records = []

          # 1. Official Data.gov.in Agmarknet CSV Stream Endpoint (Lightweight & avoids proxy JSON timeout)
          api_key = '579b464db66ecb3875b39ed9319231f2'
          resource_id = '9ef84268-d588-465a-a308-a864a43d0070'
          csv_url = f'https://api.data.gov.in/resource/{resource_id}?api-key={api_key}&format=csv&limit=1000'

          # Reliable fast mirror streams
          stream_urls = [
              f'https://api.allorigins.win/raw?url={requests.utils.quote(csv_url)}',
              f'https://corsproxy.io/?{requests.utils.quote(csv_url)}'
          ]

          for s_url in stream_urls:
              try:
                  print(f'Connecting to dynamic stream: {s_url[:50]}...')
                  res = requests.get(s_url, headers=headers, timeout=20)
                  if res.status_code == 200 and len(res.text) > 200:
                      csv_reader = csv.DictReader(io.StringIO(res.text))
                      for row in csv_reader:
                          st = (row.get('state') or row.get('State') or '').strip()
                          mkt = (row.get('market') or row.get('Market') or '').strip()
                          comm = (row.get('commodity') or row.get('Commodity') or '').strip()
                          price = str(row.get('modal_price') or row.get('Modal_Price') or row.get('price') or '0').strip()

                          if st and comm and 'national' not in mkt.lower() and 'all india' not in st.lower():
                              records.append({
                                  'state': st,
                                  'district': (row.get('district') or row.get('District') or '').strip(),
                                  'market': mkt,
                                  'commodity': comm,
                                  'modal_price': price
                              })

                      if len(records) > 0:
                          print(f'SUCCESS: Streamed {len(records)} live dynamic APMC records.')
                          break
              except Exception as err:
                  print(f'Stream notice: {err}')

          if len(records) == 0:
              print('CRITICAL: Live dynamic stream could not retrieve records.')
              sys.exit(1)

          target_file = os.path.join(os.getcwd(), 'mandi_live.json')
          with open(target_file, 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          print(f'Saved {len(records)} live dynamic records into {target_file}')
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git status
          git commit -m "Auto-sync real live Mandi rates [skip ci]" || echo "No changes to commit"
          git push origin main
