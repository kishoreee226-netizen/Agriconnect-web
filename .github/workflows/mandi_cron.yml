name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Live Agmarknet Daily Data
        run: |
          python -c "
          import requests
          import json
          import csv
          import io

          # Direct Daily Agmarknet Commodity Report Feed
          csv_url = 'https://raw.githubusercontent.com/the-prafful/agmarknet-live-data/main/latest_mandi_prices.csv'
          json_url = 'https://raw.githubusercontent.com/the-prafful/agmarknet-live-data/main/latest_mandi_prices.json'

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
          }

          records = []

          # Method 1: Direct JSON Feed
          try:
              res = requests.get(json_url, headers=headers, timeout=25)
              if res.status_code == 200:
                  data = res.json()
                  records = data if isinstance(data, list) else data.get('records', [])
          except Exception as e:
              print(f'JSON fetch note: {e}')

          # Method 2: Live CSV parsing fallback
          if not records:
              try:
                  res = requests.get(csv_url, headers=headers, timeout=25)
                  if res.status_code == 200:
                      reader = csv.DictReader(io.StringIO(res.text))
                      for row in reader:
                          records.append({
                              'state': row.get('State') or row.get('state', ''),
                              'district': row.get('District') or row.get('district', ''),
                              'market': row.get('Market') or row.get('market', ''),
                              'commodity': row.get('Commodity') or row.get('commodity', ''),
                              'modal_price': row.get('Modal_Price') or row.get('modal_price') or row.get('Modal Price', '0')
                          })
              except Exception as e:
                  print(f'CSV fetch note: {e}')

          if len(records) > 0:
              with open('mandi_live.json', 'w', encoding='utf-8') as f:
                  json.dump(records, f, ensure_ascii=False, indent=2)
              print(f'Success! Updated mandi_live.json with {len(records)} live records.')
          else:
              print('Records list empty.')
              exit(1)
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Auto-sync real Mandi rates [skip ci]" || echo "No changes"
          git push
