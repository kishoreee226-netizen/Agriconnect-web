name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Live Data with Python
        run: |
          python -c "
          import requests, json

          url = 'https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070'
          params = {
              'api-key': '579b464db66ec23bdd0000012873d6e8fa3847a564325d817ed2b023',
              'format': 'json',
              'limit': '100'
          }
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*'
          }

          try:
              res = requests.get(url, params=params, headers=headers, timeout=30)
              if res.status_code == 200 and 'records' in res.text:
                  with open('mandi_live.json', 'w') as f:
                      f.write(res.text)
                  print('Success: Data written to mandi_live.json')
              else:
                  print(f'Govt server status: {res.status_code}')
          except Exception as e:
              print(f'Error fetching: {e}')
          "

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Auto-update live mandi rates [skip ci]" || exit 0
          git push
