name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Real Daily Agmarknet Feed
        run: |
          python -c "
          import requests
          import json
          import csv
          import io

          # Official Daily Agmarknet Price Bulletin (Direct Open Portal Data)
          csv_endpoint = 'https://agmarknet.gov.in/PriceTrends/SA_Pri_Month.aspx'
          data_gov_url = 'https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ecb3875b39ed9319231f2&format=csv&limit=3000'

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': '*/*'
          }

          records = []

          # Proxy-safe Govt Open Data Request
          proxy_url = 'https://corsproxy.io/?url=' + requests.utils.quote(data_gov_url)
          try:
              res = requests.get(proxy_url, headers=headers, timeout=35)
              if res.status_code == 200 and len(res.text) > 100:
                  reader = csv.DictReader(io.StringIO(res.text))
                  for row in reader:
                      st = row.get('state') or row.get('State') or ''
                      if st:
                          records.append({
                              'state': st,
                              'district': row.get('district') or row.get('District') or '',
                              'market': row.get('market') or row.get('Market') or '',
                              'commodity': row.get('commodity') or row.get('Commodity') or '',
                              'modal_price': row.get('modal_price') or row.get('Modal_Price') or '0'
                          })
                  print(f'Successfully downloaded {len(records)} live records via official feed.')
          except Exception as e:
              print(f'Attempt 1 note: {e}')

          if len(records) > 0:
              with open('mandi_live.json', 'w', encoding='utf-8') as f:
                  json.dump(records, f, ensure_ascii=False, indent=2)
              print(f'Done! Successfully saved {len(records)} genuine records to mandi_live.json.')
          else:
              print('Could not retrieve live data.')
              exit(1)
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Auto-sync real Mandi rates [skip ci]" || echo "No changes"
          git push
