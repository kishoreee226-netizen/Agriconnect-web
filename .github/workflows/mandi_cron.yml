name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Fetch Live Agmarknet Mandi Records
        run: |
          python -c "
          import requests
          import json
          import urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*'
          }

          records = []

          # 1. Multi-state Open Agmarknet Daily Live Endpoint
          api_targets = [
              'https://raw.githubusercontent.com/the-prafful/agmarknet-live-data/master/latest_mandi_prices.json',
              'https://api.allorigins.win/raw?url=' + requests.utils.quote('https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ecb3875b39ed9319231f2&format=json&limit=1000')
          ]

          for target in api_targets:
              try:
                  res = requests.get(target, headers=headers, timeout=20, verify=False)
                  if res.status_code == 200:
                      data = res.json()
                      items = data if isinstance(data, list) else data.get('records', [])
                      for item in items:
                          st = item.get('state') or item.get('State') or ''
                          comm = item.get('commodity') or item.get('Commodity') or ''
                          if st and comm and 'all india' not in st.lower():
                              records.append({
                                  'state': st.strip(),
                                  'district': (item.get('district') or item.get('District') or '').strip(),
                                  'market': (item.get('market') or item.get('Market') or '').strip(),
                                  'commodity': comm.strip(),
                                  'modal_price': str(item.get('modal_price') or item.get('Modal_Price') or item.get('price') or '0').strip()
                              })
                      if len(records) > 0:
                          print(f'Successfully pulled {len(records)} authentic records from {target}')
                          break
              except Exception as e:
                  print(f'Feed attempt notice: {e}')

          # 2. Safety Net: In case govt firewalls drop external cloud requests,
          # retain current active data without crashing the pipeline
          if len(records) == 0:
              try:
                  with open('mandi_live.json', 'r', encoding='utf-8') as f:
                      existing = json.load(f)
                      if existing and len(existing) > 0:
                          records = existing
                          print(f'Retained {len(records)} existing verified records.')
              except Exception as e:
                  print(f'Local read notice: {e}')

          with open('mandi_live.json', 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          print(f'File write complete: {len(records)} records saved.')
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Auto-sync real Mandi rates [skip ci]" || echo "No changes"
          git push
