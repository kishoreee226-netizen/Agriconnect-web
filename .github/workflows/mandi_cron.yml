name: Update Mandi Rates

on:
  schedule:
    # Roju ki 3 sarlu automatic ga run avthundhi (IST 6 AM, 12 PM, 6 PM)
    - cron: '30 0,6,12 * * *'
  workflow_dispatch: # Manual ga run cheyadaniki button

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Live Data from Govt API
        run: |
          curl -s "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ec23bdd0000012873d6e8fa3847a564325d817ed2b023&format=json&limit=100" > mandi_live.json

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git commit -m "Auto-update live mandi rates [skip ci]" || exit 0
          git push
