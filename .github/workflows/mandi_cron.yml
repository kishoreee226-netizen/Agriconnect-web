name: Update Mandi Rates

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and Sync Live Mandi Rates
        run: |
          python -c "
          import requests
          import json
          import os
          import sys

          # Real authentic daily open data mirror of Indian Agmarknet
          url = 'https://raw.githubusercontent.com/sivakar/agmarknet-data/master/data/latest.json'

          headers = {
              'User-Agent': 'Mozilla/5.0'
          }

          print('Downloading live authentic market records...')
          res = requests.get(url, headers=headers, timeout=30)

          if res.status_code != 200 or len(res.text) < 100:
              print(f'Error fetching data: HTTP {res.status_code}')
              sys.exit(1)

          raw_items = res.json()
          records = []

          for it in raw_items:
              st = (it.get('state') or it.get('State') or '').strip()
              mkt = (it.get('market') or it.get('Market') or '').strip()
              comm = (it.get('commodity') or it.get('Commodity') or '').strip()
              pr = str(it.get('modal_price') or it.get('Modal_Price') or it.get('price') or '0').strip()

              if st and comm and pr != '0':
                  records.append({
                      'state': st,
                      'district': (it.get('district') or it.get('District') or '').strip(),
                      'market': mkt,
                      'commodity': comm,
                      'modal_price': pr
                  })

          if len(records) == 0:
              print('No records found.')
              sys.exit(1)

          out_path = os.path.join(os.getcwd(), 'mandi_live.json')
          with open(out_path, 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          print(f'SUCCESS: Wrote {len(records)} authentic APMC records into mandi_live.json')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git status
          git commit -m "Auto-sync real live Mandi rates [skip ci]" || echo "No changes"
          git push origin main
