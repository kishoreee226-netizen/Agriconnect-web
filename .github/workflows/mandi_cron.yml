name: Update Mandi Rates

on:
  schedule:
    - cron: '30 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Fetch Real Dynamic Mandi Rates
        run: |
          python -c "
          import requests
          import json
          import os
          import sys
          import urllib3

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          # e-NAM Official Live APMC Trade Data Endpoint
          url = 'https://enam.gov.in/web/Ajax_ctrl/trade_data_list'

          headers = {
              'User-Agent': 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36',
              'Accept': 'application/json, text/javascript, */*; q=0.01',
              'Accept-Language': 'en-US,en;q=0.9',
              'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
              'X-Requested-With': 'XMLHttpRequest',
              'Origin': 'https://enam.gov.in',
              'Referer': 'https://enam.gov.in/web/dashboard/trade-data'
          }

          payload = {
              'language': 'en',
              'state_name': '-- All --',
              'apmc_name': '-- All --',
              'commodity_name': '-- All --'
          }

          records = []
          try:
              session = requests.Session()
              # First hit the dashboard to grab active session cookies
              session.get('https://enam.gov.in/web/dashboard/trade-data', headers=headers, timeout=15, verify=False)
              
              print('Querying live trade data from e-NAM...')
              res = session.post(url, headers=headers, data=payload, timeout=25, verify=False)
              
              if res.status_code == 200 and res.text.strip():
                  data = res.json()
                  items = data.get('data', []) if isinstance(data, dict) else []
                  for it in items:
                      state = (it.get('state_name') or it.get('state') or '').strip()
                      market = (it.get('apmc_name') or it.get('market') or '').strip()
                      commodity = (it.get('commodity_name') or it.get('commodity') or '').strip()
                      price = str(it.get('modal_price') or it.get('max_price') or it.get('min_price') or '0').strip()

                      if state and commodity and 'national' not in market.lower() and 'all india' not in state.lower():
                          records.append({
                              'state': state,
                              'district': (it.get('district_name') or it.get('district') or '').strip(),
                              'market': market,
                              'commodity': commodity,
                              'modal_price': price
                          })
                  print(f'SUCCESS: Fetched {len(records)} authentic APMC records from e-NAM.')
          except Exception as err:
              print(f'eNAM Fetch notice: {err}')

          if len(records) == 0:
              print('CRITICAL: Live dynamic records could not be fetched.')
              sys.exit(1)

          file_path = os.path.join(os.getcwd(), 'mandi_live.json')
          with open(file_path, 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          print(f'Saved {len(records)} authentic records to {file_path}')
          "

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_live.json
          git status
          git commit -m "Auto-sync live dynamic APMC rates [skip ci]" || echo "No changes"
          git push origin main
